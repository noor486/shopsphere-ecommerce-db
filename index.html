<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12343B; --ink-soft:#4A6368; --paper:#F5F8F7; --card:#FFFFFF; --line:#D9E3E1; --mint:#E4EFEC;
  --saffron:#F2A93B; --saffron-deep:#DB8E1C; --danger:#B3261E; --ok:#1F7A4D;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:92px}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron-deep);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}

/* header: one row with menu, logo, cart and profile; search sits on its own row below */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;flex-wrap:nowrap;gap:8px;padding:10px clamp(12px,3vw,32px)}
.burger{flex:none;display:grid;place-items:center;width:42px;height:42px;background:none;border:0;border-radius:50%;color:#fff;padding:0}
.burger:hover{background:rgba(255,255,255,.12)}
.logo{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;color:#fff;font:800 24px var(--display);letter-spacing:-.02em;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{flex:none;display:flex;align-items:center;gap:10px}
.cart-btn{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:var(--saffron);color:var(--ink);padding:0}
.cart-btn svg{fill:currentColor}
.cart-btn .pill{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:12px;font-weight:700;line-height:16px;text-align:center}
.pill[hidden]{display:none}
.badge{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid #6F8F93;background:none;color:#fff;padding:0;font:800 18px var(--display)}
.badge.in{background:#fff;border-color:#fff;color:var(--ink)}
.badge svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tip{position:absolute;top:calc(100% + 8px);right:0;z-index:30;background:#fff;color:var(--ink);padding:5px 12px;border-radius:8px;box-shadow:0 6px 18px rgba(18,52,59,.25);font:600 14px var(--body);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.badge:hover .tip,.badge:focus-visible .tip{opacity:1}
.searchbar{background:var(--ink);padding:2px clamp(12px,3vw,32px) 18px}
.search{position:relative;max-width:760px;margin:0 auto}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.search input{width:100%;padding:13px 18px 13px 46px;border:0;border-radius:999px;background:#fff;color:var(--ink)}

/* page */
main{max-width:1200px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 40px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.count{margin:0;color:var(--ink-soft)}
.toolbar select,.field select,.field input,.field textarea{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px}
.shop-head{margin-bottom:14px}
.shop-head h1{font-size:clamp(26px,4vw,36px)}
.crumb{margin:0 0 2px;color:var(--ink-soft);font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill-btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:5px 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card:hover{border-color:var(--ink-soft)}
.card-main{display:block;width:100%;background:none;border:0;padding:0;text-align:left}
.tile{position:relative;display:grid;place-items:center;aspect-ratio:4/3;overflow:hidden;color:rgba(255,255,255,.92);font:800 clamp(46px,6vw,66px)/1 var(--display);letter-spacing:-.03em}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:0;bottom:14px;background:var(--saffron);color:var(--ink);font:800 15px var(--display);letter-spacing:0;padding:5px 12px 5px 24px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:11px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--ink)}
.badge-low{position:absolute;top:10px;left:10px;background:#fff;color:var(--danger);font:600 12px var(--body);letter-spacing:0;padding:2px 9px;border-radius:999px}
.card-body{display:block;padding:12px 14px 14px}
.card-name{display:block;font:600 17px/1.25 var(--display)}
.card-meta{display:block;margin-top:2px;font-size:14px;color:var(--ink-soft)}
.rating{display:block;margin-top:6px;font-size:14px}
.rating span{color:var(--saffron-deep);letter-spacing:1px}
.note{display:block;margin-top:2px;font-size:14px;font-weight:600;color:var(--ok)}
.heart{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink-soft)}
.heart svg{fill:none;stroke:currentColor;stroke-width:2}
.heart.on{color:var(--danger)}
.heart.on svg{fill:currentColor}
.empty{max-width:480px;margin:56px auto;text-align:center}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--ink-soft);margin:0 0 16px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;background:var(--mint);border-radius:22px;padding:clamp(24px,5vw,56px);overflow:hidden}
.hero h1{font-size:clamp(32px,5.4vw,56px);letter-spacing:-.02em;margin-bottom:22px;max-width:14em}
.hero-art{align-self:stretch}
.hero-art img{display:block;width:100%;height:100%;min-height:240px;max-height:400px;object-fit:cover;border-radius:16px}
.hero.no-art{grid-template-columns:1fr}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 8px}
.perk{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.perk svg{flex:none;color:var(--ink);background:var(--mint);border-radius:50%;padding:8px;width:40px;height:40px}
.perk b{display:block;font:600 16px var(--display)}
.perk span{font-size:14px;color:var(--ink-soft)}
.band{margin-top:34px}
.band-head{margin-bottom:14px}
.band-head h2{font-size:clamp(24px,3.4vw,32px)}
.band-head p{margin:2px 0 0;color:var(--ink-soft)}
.cta{background:var(--ink);color:#fff;border-radius:22px;padding:40px clamp(20px,4vw,48px);text-align:center;margin-top:38px}
.cta h2{font-size:clamp(26px,4vw,36px);margin-bottom:8px}
.cta p{margin:0 0 20px;color:#CFE0DE}
.cta .row{justify-content:center}

/* buttons */
.btn{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.big{padding:12px 22px;font-size:17px;border-radius:10px}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:var(--ink)}
.btn.primary:hover{background:var(--saffron-deep);border-color:var(--saffron-deep)}
.btn.light{background:transparent;color:#fff;border-color:#fff}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-weight:600}

/* bottom bar */
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:25;display:flex;gap:4px;width:min(520px,calc(100% - 24px));background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 8px 28px rgba(18,52,59,.2)}
.dock button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:999px;padding:6px 4px;color:var(--ink-soft);font-size:12px;font-weight:600}
.dock svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{background:var(--ink);color:#fff}
.dock .count{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--saffron);color:var(--ink);font-size:11px;line-height:18px;text-align:center}
.dock .count[hidden]{display:none}

/* profile */
.profile{max-width:640px;margin:0 auto}
.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.avatar-big{display:grid;place-items:center;flex:none;width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;font:800 30px var(--display)}
.profile h1{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 22px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stats b{display:block;font:800 26px var(--display)}
.stats span{color:var(--ink-soft);font-size:14px}
.profile h2{font-size:20px;margin:0 0 8px}
.addr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}

/* overlays */
#overlay:empty{display:none}
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(18,52,59,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.backdrop.side{justify-content:flex-end;padding:0;align-items:stretch}
.backdrop.side.left{justify-content:flex-start}
.dialog{position:relative;background:#fff;border-radius:14px;width:min(860px,100%);max-height:92vh;overflow:auto;padding:24px}
.dialog.narrow{width:min(520px,100%)}
.drawer{background:#fff;width:min(430px,100%);height:100%;overflow:auto;padding:22px;animation:slide .2s ease-out}
.drawer.left{width:min(330px,100%);animation:slideL .2s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:28px;line-height:1;color:var(--ink-soft);padding:4px 8px}
.menu-list{display:grid;gap:2px;margin-top:14px}
.menu-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:11px 12px;border-radius:8px;font-size:17px}
.menu-list button:hover,.menu-list button[aria-current="true"]{background:var(--paper)}
.menu-list button[aria-current="true"]{font-weight:600}
.menu-list .parent svg{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.menu-list .parent[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu-list .parent[aria-expanded="true"]{font-weight:600}
.subs{display:grid;gap:2px;margin:0 0 6px 14px;padding-left:10px;border-left:2px solid var(--line)}
.subs[hidden]{display:none}
.menu-list .sub{font-size:16px;color:var(--ink-soft)}
.dlg-grid{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:24px}
.dlg-tile{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:10px;overflow:hidden;color:rgba(255,255,255,.92);font:800 84px/1 var(--display);letter-spacing:-.03em}
.dlg-media{align-self:start}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumb{width:56px;height:56px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--line)}
.thumb[aria-pressed="true"]{border-color:var(--ink)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.dlg-info h2{font-size:28px;margin-bottom:4px;padding-right:30px}
.muted{color:var(--ink-soft);margin:0 0 8px;font-size:15px}
fieldset{border:0;padding:0;margin:14px 0}
legend{font-weight:600;margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;text-align:left}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:6px 11px}
.opt small{display:block;color:var(--ink-soft)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.stock{margin:6px 0;font-weight:600}
.stock.low{color:var(--danger)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{background:#fff;border:0;width:34px;height:34px;font-size:18px}
.stepper span{min-width:34px;text-align:center;font-weight:600}
.similar{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.similar h3,.reviews h3{font-size:20px;margin-bottom:10px}
.reviews{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.review{padding:10px 0;border-bottom:1px solid var(--line)}
.review b{font-weight:600}
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:4px}
.field textarea,.field input,.field select{width:100%}
.err{color:var(--danger);margin:8px 0 0;font-weight:600}
.ok{color:var(--ok);margin:6px 0 0;font-weight:600}

/* cart and checkout */
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .name{font-weight:600}
.line .controls{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:4px}
.sum{margin:16px 0;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font:800 20px var(--display);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.coupon{display:flex;gap:8px;margin-top:14px}
.coupon input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.pick input{margin-top:5px}

/* orders */
.order{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.order-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.order-head h2{font-size:20px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:14px}
.s-Delivered,.s-Completed{background:#E3F3EA;color:#17603B}
.s-Shipped{background:#E4EAF8;color:#2F4B9B}
.s-Processing,.s-Pending{background:#FFF0CF;color:#7A4F00}
.s-Cancelled,.s-Failed,.s-Refunded{background:#FBE5E3;color:var(--danger)}
.order table{width:100%;border-collapse:collapse;margin:8px 0}
.order th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:14px;padding:4px 6px 4px 0}
.order td{padding:6px 6px 6px 0;border-top:1px solid var(--line)}
.order td.r,.order th.r{text-align:right}
.facts{display:grid;gap:4px;margin-top:10px;font-size:15px}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 24px);text-align:center}
#toast.show{opacity:1}
footer{max-width:1200px;margin:0 auto;padding:0 clamp(14px,3vw,32px) 24px;color:var(--ink-soft);font-size:14px}

/* tablets and phones */
@media (max-width:900px){
  .perks{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero-art img{min-height:0;height:220px}
}
@media (max-width:640px){
  .logo{font-size:21px}
  .top-right{gap:8px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid.small{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-name{font-size:15px}
  .card-meta,.rating{font-size:13px}
  .card-body{padding:10px 10px 12px}
  .tag{font-size:13px;padding:4px 10px 4px 20px}
  .dlg-grid{grid-template-columns:1fr}
  .dlg-tile{aspect-ratio:16/9;font-size:56px}
  .dialog{max-height:100vh;border-radius:0;height:100%}
  .backdrop{padding:0}
  .perk{padding:12px}
}
@media (max-width:360px){
  .logo{font-size:19px}
  .perks{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .drawer,.drawer.left{animation:none}
  #toast,.tip,.menu-list .parent svg{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="burger" data-act="menu-open" aria-label="Open menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
  <button class="logo" data-act="nav" data-view="home">ShopSphere</button>
  <div class="top-right">
    <button class="cart-btn" data-act="cart-open" aria-label="Open cart"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><span class="pill" id="n-cart" hidden>0</span></button>
    <div id="account"></div>
  </div>
</header>
<div class="searchbar">
  <div class="search">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <label class="sr" for="q">Search products</label>
    <input id="q" type="search" placeholder="Search for products" autocomplete="off">
  </div>
</div>
<main id="main"></main>
<footer>ShopSphere is a student project. The products, customers and orders here are the sample rows from the project's SQL Server database. Anything you change stays in this page until the backend is connected.</footer>
<nav class="dock" aria-label="Main">
  <button data-act="nav" data-view="home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="nav" data-view="wishlist"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Wishlist<span class="count" id="n-wish" hidden>0</span></button>
  <button data-act="nav" data-view="orders"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>My orders</button>
  <button data-act="profile-open"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
</nav>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This page needs JavaScript to show the shop.</noscript>

<script>
/*
  How this page works
  - DB below holds the sample rows from schema.sql (products, variants, customers, orders, and so on).
  - When the backend exists, replace DB with data fetched from the API. The rest of the page stays the same.
  - Cart, wishlist, new orders, reviews and new accounts live in memory only, so a page refresh resets them.
*/

// ---------- small helpers ----------
const $ = s => document.querySelector(s);
const by = a => Object.fromEntries(a.map(x => [x.id, x]));
const clone = x => JSON.parse(JSON.stringify(x));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => {
  const r = Math.round(n * 100) / 100;
  return 'Rs ' + (r % 1 === 0 ? r.toLocaleString('en-US') : r.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
};
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const ico = (paths, size) => '<svg viewBox="0 0 24 24" width="' + (size || 24) + '" height="' + (size || 24) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';

const cats = by(DB.categories), sellers = by(DB.sellers), prods = by(DB.products), vars = by(DB.variants), custs = by(DB.customers);
const imgs = {};
DB.images.forEach(i => (imgs[i.productId] = imgs[i.productId] || []).push(i));
// Pictures live in the images folder next to this page. A product's picture is images/ plus the file name saved in the ProductImage table.
const imagesOf = pid => (imgs[pid] || []).slice().sort((a, b) => b.isPrimary - a.isPrimary).map(i => 'images/' + String(i.url).split('/').pop());
// Demo only: sample accounts share this password. The real app checks a hashed password in the backend.
const DEMO_PASSWORD = 'shop1234';
const METHODS = ['Credit Card', 'JazzCash', 'Easypaisa', 'Cash on Delivery', 'Bank Transfer'];
const COLORS = { 'Electronics': '#2F4B9B', 'Fashion': '#B23A5A', 'Home & Kitchen': '#52702F', 'Books': '#6B3FA0', 'Sports & Outdoors': '#B8501A', 'Beauty & Personal Care': '#0E7C7B', 'Bath & Body': '#8A6A1F' };
const SORTS = [['featured', 'Featured'], ['price-asc', 'Price, low to high'], ['price-desc', 'Price, high to low'], ['rating', 'Top rated']];

// ---------- page state (everything the page remembers) ----------
const state = {
  customerId: null, view: 'home', query: '', cat: 0, sort: 'featured',
  carts: clone(DB.carts), wish: clone(DB.wishlist),
  orders: clone(DB.orders), items: clone(DB.orderItems), payments: clone(DB.payments), shipments: clone(DB.shipments),
  reviews: clone(DB.reviews), addresses: clone(DB.addresses),
  stock: Object.fromEntries(DB.variants.map(v => [v.id, v.stock])),
  passwords: Object.fromEntries(DB.customers.map(c => [c.id, DEMO_PASSWORD])), form: {},
  coupon: null, couponInput: '', couponMsg: '',
  menuOpen: {}, overlay: null, modal: null, checkout: null, confirmId: null
};

const cartOf = id => (state.carts[id] = state.carts[id] || []);
const wishOf = id => (state.wish[id] = state.wish[id] || []);

// ---------- categories ----------
// One Category table holds everything. A category with no parent is a main category (Electronics).
// A category with a parent is a subcategory (Mobiles belongs to Electronics).
// Every product points to exactly one category, usually the most specific one (the earbuds point to Mobiles).
const topOf = id => { let c = cats[id]; while (c.parentId) c = cats[c.parentId]; return c; };
const inCat = (cid, root) => { let c = cats[cid]; while (c) { if (c.id === root) return true; c = c.parentId ? cats[c.parentId] : null; } return false; };
const catPath = cid => { const out = []; let c = cats[cid]; while (c) { out.unshift(c.name); c = c.parentId ? cats[c.parentId] : null; } return out; };

// ---------- products ----------
const colorOf = p => COLORS[topOf(p.categoryId).name] || '#12343B';
const variantsOf = pid => DB.variants.filter(v => v.productId === pid);
const stockOf = p => variantsOf(p.id).reduce((s, v) => s + state.stock[v.id], 0);
const priceOf = p => { const vs = variantsOf(p.id); return vs.length ? Math.min.apply(null, vs.map(v => v.price)) : p.basePrice; };
const initials = n => n.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const vLabel = v => {
  const parts = [];
  if (v.size && v.size !== 'Standard' && v.size !== 'N/A') parts.push(v.size);
  if (v.color && v.color !== 'N/A') parts.push(v.color);
  return parts.join(', ') || 'Standard';
};
const ratingOf = pid => {
  const r = state.reviews.filter(x => x.productId === pid);
  return { n: r.length, avg: r.length ? r.reduce((s, x) => s + x.rating, 0) / r.length : 0 };
};
const PIC = src => '<img class="pic" src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">';
const stars = a => '★'.repeat(Math.round(a)) + '☆'.repeat(5 - Math.round(a));
const addressOf = id => state.addresses.find(a => a.id === id);

function soldByProduct() {
  const live = new Set(state.orders.filter(o => o.status !== 'Cancelled').map(o => o.id));
  const sold = {};
  state.items.forEach(i => { if (live.has(i.orderId)) { const pid = vars[i.variantId].productId; sold[pid] = (sold[pid] || 0) + i.qty; } });
  return sold;
}
// Similar products: same category first, then the rest of the same main category, best rated first.
function similarTo(p) {
  const top = topOf(p.categoryId).id;
  return DB.products.filter(x => x.id !== p.id && topOf(x.categoryId).id === top)
    .map(x => ({ x: x, score: (x.categoryId === p.categoryId ? 2 : 0) + ratingOf(x.id).avg / 10 }))
    .sort((a, b) => b.score - a.score || a.x.name.localeCompare(b.x.name)).slice(0, 4).map(o => o.x);
}

function cartLines() {
  return cartOf(state.customerId).map(l => {
    const v = vars[l.variantId];
    return { variantId: l.variantId, qty: l.qty, v: v, p: prods[v.productId], price: v.price };
  });
}
function totals(lines, coupon) {
  const sub = lines.reduce((s, l) => s + l.qty * l.price, 0);
  const disc = coupon ? (coupon.type === 'Percentage' ? sub * coupon.value / 100 : Math.min(coupon.value, sub)) : 0;
  return { sub: sub, disc: disc, total: sub - disc };
}

// ---------- cards ----------
const HEART = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
function cardHTML(p, note) {
  const r = ratingOf(p.id), wished = !!state.customerId && wishOf(state.customerId).includes(p.id), first = imagesOf(p.id)[0];
  return '<article class="card">' +
    '<button class="card-main" data-act="open" data-id="' + p.id + '">' +
      '<span class="tile" style="background:' + colorOf(p) + '">' + esc(initials(p.name)) + (first ? PIC(first) : '') +
        (stockOf(p) < 10 ? '<span class="badge-low">Low stock</span>' : '') +
        '<span class="tag">' + money(priceOf(p)) + '</span></span>' +
      '<span class="card-body">' +
        '<span class="card-name">' + esc(p.name) + '</span>' +
        '<span class="card-meta">' + esc(cats[p.categoryId].name) + ', sold by ' + esc(sellers[p.sellerId].name) + '</span>' +
        '<span class="rating">' + (r.n ? '<span aria-hidden="true">' + stars(r.avg) + '</span> ' + r.avg.toFixed(1) + ' (' + r.n + ' review' + (r.n > 1 ? 's' : '') + ')' : 'No reviews yet') + '</span>' +
        (note ? '<span class="note">' + esc(note) + '</span>' : '') +
      '</span></button>' +
    '<button class="heart' + (wished ? ' on' : '') + '" data-act="wish" data-id="' + p.id + '" aria-pressed="' + wished + '" aria-label="' + (wished ? 'Remove from' : 'Save to') + ' wishlist: ' + esc(p.name) + '">' + HEART + '</button>' +
  '</article>';
}

// ---------- home ----------
const PERKS = [
  [ico('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'), 'Pay your way', 'Card, JazzCash, Easypaisa, bank transfer or cash on delivery'],
  [ico('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'), 'Follow your order', 'See the payment and shipment status of every order'],
  [ico('<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'), 'Coupon codes', 'Add a code at checkout to save on your order'],
  [ico('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'), 'Read the reviews', 'See what other shoppers think on every product page']
];
function homeView() {
  const sold = soldByProduct();
  const popular = DB.products.filter(p => sold[p.id]).sort((a, b) => sold[b.id] - sold[a.id] || a.name.localeCompare(b.name)).slice(0, 4);
  const best = DB.products.map(p => ({ p: p, r: ratingOf(p.id) })).filter(o => o.r.n > 0)
    .sort((a, b) => b.r.avg - a.r.avg || b.r.n - a.r.n || a.p.name.localeCompare(b.p.name)).slice(0, 4).map(o => o.p);
  const band = (title, sub, list, note) => list.length ? '<section class="band"><div class="band-head"><h2>' + title + '</h2><p>' + sub + '</p></div><div class="grid">' + list.map(p => cardHTML(p, note ? note(p) : '')).join('') + '</div></section>' : '';
  return '<section class="hero"><div><h1>Everything you need, one cart away</h1>' +
    '<div class="row"><button class="btn primary big" data-act="nav" data-view="shop">Start shopping</button><button class="btn big" data-act="menu-open">Browse categories</button></div></div>' +
    '<div class="hero-art"><img src="images/hero.jpg" alt="" onerror="this.closest(\'.hero\').classList.add(\'no-art\');this.parentNode.remove()"></div></section>' +
    '<div class="perks">' + PERKS.map(k => '<div class="perk">' + k[0] + '<div><b>' + k[1] + '</b><span>' + k[2] + '</span></div></div>').join('') + '</div>' +
    band('Most ordered', 'What shoppers buy the most', popular, p => sold[p.id] + ' sold') +
    band('Top rated', 'The products shoppers rated highest', best) +
    '<section class="cta"><h2>Ready to look around?</h2><p>See every product, or start from a category.</p>' +
    '<div class="row"><button class="btn primary big" data-act="nav" data-view="shop">See all products</button><button class="btn light big" data-act="menu-open">Browse categories</button></div></section>';
}

// ---------- shop ----------
function visibleProducts() {
  const q = state.query.trim().toLowerCase();
  const list = DB.products.filter(p => {
    if (state.cat && !inCat(p.categoryId, state.cat)) return false;
    if (!q) return true;
    return p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q);
  });
  if (state.sort === 'price-asc') list.sort((a, b) => priceOf(a) - priceOf(b));
  else if (state.sort === 'price-desc') list.sort((a, b) => priceOf(b) - priceOf(a));
  else if (state.sort === 'rating') list.sort((a, b) => ratingOf(b.id).avg - ratingOf(a.id).avg);
  return list;
}
function shopView() {
  const list = visibleProducts(), q = state.query.trim();
  const path = state.cat ? catPath(state.cat) : [];
  const title = q && !state.cat ? 'Search results' : state.cat ? path[path.length - 1] : 'All products';
  const sortSel = SORTS.map(s => '<option value="' + s[0] + '"' + (state.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>').join('');
  const filters = (state.cat ? '<button class="pill-btn" data-act="clear-cat" aria-label="Remove category filter">' + esc(path.join(' / ')) + ' ×</button>' : '') +
    (q ? '<button class="pill-btn" data-act="clear-q" aria-label="Remove search filter">“' + esc(q) + '” ×</button>' : '');
  return '<div class="shop-head">' + (path.length > 1 ? '<p class="crumb">' + esc(path.slice(0, -1).join(' / ')) + '</p>' : '') + '<h1>' + esc(title) + '</h1>' + (filters ? '<div class="filters">' + filters + '</div>' : '') + '</div>' +
    '<div class="toolbar">' + (state.cat || q ? '<p class="count">' + list.length + ' product' + (list.length === 1 ? '' : 's') + '</p>' : '<span></span>') +
    '<label>Sort by <select data-bind="sort">' + sortSel + '</select></label></div>' +
    (list.length ? '<div class="grid">' + list.map(p => cardHTML(p)).join('') + '</div>' :
      '<div class="empty"><h2>No products found</h2><p>Try a shorter word or pick another category.</p><button class="btn" data-act="clear">Clear search and filters</button></div>');
}

// ---------- wishlist, orders, profile ----------
const guestPrompt = (title, msg) => '<div class="empty"><h2>' + title + '</h2><p>' + msg + '</p><button class="btn primary" data-act="login-open">Log in</button> <button class="btn" data-act="signup-open">Create an account</button></div>';
function wishView() {
  if (!state.customerId) return guestPrompt('Log in to use your wishlist', 'Saved products are kept in your account.');
  const ids = wishOf(state.customerId);
  if (!ids.length) return '<div class="empty"><h2>Your wishlist is empty</h2><p>Tap the heart on any product to save it here.</p><button class="btn primary" data-act="nav" data-view="shop">Browse the shop</button></div>';
  return '<div class="shop-head"><h1>Wishlist</h1></div><div class="toolbar"><p class="count">' + ids.length + ' saved product' + (ids.length === 1 ? '' : 's') + '</p></div><div class="grid">' + ids.map(id => cardHTML(prods[id])).join('') + '</div>';
}
function ordersView() {
  if (!state.customerId) return guestPrompt('Log in to see your orders', 'Your orders are kept in your account.');
  const mine = state.orders.filter(o => o.customerId === state.customerId).sort((a, b) => b.date.localeCompare(a.date));
  if (!mine.length) return '<div class="empty"><h2>No orders yet</h2><p>' + esc(custs[state.customerId].name) + ' has not placed an order. Add something to the cart and check out.</p><button class="btn primary" data-act="nav" data-view="shop">Browse the shop</button></div>';
  return '<div class="shop-head"><h1>My orders</h1></div>' + mine.map(o => {
    const its = state.items.filter(i => i.orderId === o.id);
    const pays = state.payments.filter(p => p.orderId === o.id);
    const ship = state.shipments.find(s => s.orderId === o.id);
    const addr = ship ? addressOf(ship.addressId) : null;
    const coupon = o.couponId ? DB.coupons.find(c => c.id === o.couponId) : null;
    const sub = its.reduce((s, i) => s + i.qty * i.unitPrice, 0);
    const rows = its.map(i => { const v = vars[i.variantId]; return '<tr><td>' + esc(prods[v.productId].name) + '<br><small>' + esc(vLabel(v)) + '</small></td><td class="r">' + i.qty + '</td><td class="r">' + money(i.unitPrice) + '</td><td class="r">' + money(i.qty * i.unitPrice) + '</td></tr>'; }).join('');
    return '<section class="order"><div class="order-head"><h2>Order ' + o.id + '</h2><span>' + fmtDate(o.date) + ' <span class="chip s-' + o.status + '">' + o.status + '</span></span></div>' +
      '<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="facts">' +
        (coupon ? '<div>Coupon ' + esc(coupon.code) + ' saved you ' + money(sub - o.total) + '</div>' : '') +
        '<div><b>Order total: ' + money(o.total) + '</b></div>' +
        pays.map(p => '<div>Payment: ' + esc(p.method) + ', ' + money(p.amount) + ' <span class="chip s-' + p.status + '">' + p.status + '</span></div>').join('') +
        (ship ? '<div>Shipment: <span class="chip s-' + ship.status + '">' + ship.status + '</span>' + (ship.carrier ? ' with ' + esc(ship.carrier) + ', tracking ' + esc(ship.tracking) : '') + (ship.delivered ? ', delivered ' + fmtDate(ship.delivered) : '') + '</div>' : '') +
        (addr ? '<div>Ship to: ' + esc(addr.line1) + ', ' + esc(addr.city) + '</div>' : '') +
      '</div>' +
      ((o.status === 'Pending' || o.status === 'Processing') ? '<div class="row"><button class="btn danger" data-act="cancel-order" data-id="' + o.id + '">Cancel order</button></div>' : '') +
    '</section>';
  }).join('');
}

// ---------- overlays ----------
function productDialog() {

  const mine = reviews.some(x => x.customerId === state.customerId);

    const n = state.stock[x.id];
    return '<button class="opt" data-act="variant" data-id="' + x.id + '" aria-pressed="' + (x.id === m.vid) + '"' + (n === 0 ? ' disabled' : '') + '>' + esc(vLabel(x)) + '<small>' + money(x.price) + (n === 0 ? ', sold out' : '') + '</small></button>';
  }).join('');

    '<div class="field"><label for="rev-rating"><span>Your rating</span></label><select id="rev-rating" data-bind="modal.rating"><option value="">Choose a rating</option>' +
      [5, 4, 3, 2, 1].map(n => '<option value="' + n + '"' + (String(m.rating) === String(n) ? ' selected' : '') + '>' + n + ' out of 5</option>').join('') + '</select></div>' +
    '<div class="field"><label for="rev-text"><span>Your review</span></label><textarea id="rev-text" rows="3" data-bind="modal.text">' + esc(m.text) + '</textarea></div>' +
    (m.reviewError ? '<p class="err">' + esc(m.reviewError) + '</p>' : '') +
    '<button class="btn" data-act="review">Post review</button>';

    '<button class="x" data-act="close" aria-label="Close">×</button>' +
    '<div class="dlg-grid"><div class="dlg-media"><div class="dlg-tile" style="background:' + colorOf(p) + '">' + esc(initials(p.name)) + (pics[m.img] ? PIC(pics[m.img]) : '') + '</div>' +
    (pics.length > 1 ? '<div class="thumbs">' + pics.map((src, i) => '<button class="thumb" data-act="thumb" data-id="' + i + '" aria-pressed="' + (i === m.img) + '" aria-label="Picture ' + (i + 1) + ' of ' + pics.length + '"><img src="' + esc(src) + '" alt="" onerror="this.parentNode.remove()"></button>').join('') + '</div>' : '') + '</div>' +
    '<div class="dlg-info"><h2 id="dlg-title">' + esc(p.name) + '</h2>' +
      '<p class="muted">' + esc(catPath(p.categoryId).join(' / ')) + ', sold by ' + esc(s.name) + ' (seller rating ' + Number(s.rating).toFixed(1) + ')</p>' +
      '<p class="rating">' + (r.n ? '<span aria-hidden="true">' + stars(r.avg) + '</span> ' + r.avg.toFixed(1) + ' from ' + r.n + ' review' + (r.n > 1 ? 's' : '') : 'No reviews yet') + '</p>' +
      '<p>' + esc(p.description) + '</p>' +

      '<button class="btn primary" data-act="add"' + (left === 0 ? ' disabled' : '') + '>Add to cart, ' + money(v.price * m.qty) + '</button>' +
      '<button class="btn" data-act="wish" data-id="' + p.id + '" aria-pressed="' + wished + '">' + (wished ? 'Remove from wishlist' : 'Save to wishlist') + '</button></div>' +

// The menu lists the main categories. A main category with subcategories opens as a dropdown.
const CHEVRON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function menuDrawer() {
  const tops = DB.categories.filter(c => !c.parentId);
  const kidsOf = id => DB.categories.filter(s => s.parentId === id).sort((a, b) => a.name.localeCompare(b.name));
  const here = id => state.view === 'shop' && state.cat === id && !state.query.trim();
  const leaf = (id, label, cls) => '<button class="' + cls + '" data-act="menu-cat" data-id="' + id + '"' + (here(id) ? ' aria-current="true"' : '') + '><span>' + esc(label) + '</span></button>';
  const list = leaf(0, 'All products', '') + tops.map(c => {
    const kids = kidsOf(c.id);
    if (!kids.length) return leaf(c.id, c.name, '');
    const open = !!state.menuOpen[c.id];
    return '<button class="parent" data-act="menu-toggle" data-id="' + c.id + '" aria-expanded="' + open + '" aria-controls="sub-' + c.id + '"><span>' + esc(c.name) + '</span>' + CHEVRON + '</button>' +
      '<div class="subs" id="sub-' + c.id + '"' + (open ? '' : ' hidden') + '>' + leaf(c.id, 'All ' + c.name, 'sub') + kids.map(k => leaf(k.id, k.name, 'sub')).join('') + '</div>';
  }).join('');
  return '<div class="backdrop side left" data-act="backdrop"><aside class="drawer left" role="dialog" aria-modal="true" aria-label="Menu" tabindex="-1">' +
    '<button class="x" data-act="close" aria-label="Close menu">×</button><h2>Shop by category</h2><nav class="menu-list" aria-label="Categories">' + list + '</nav></aside></div>';
}

// ---------- drawing the page ----------
let lastOverlayKey = '';
function render() {
  const cid = state.customerId, active = document.activeElement;
  const keep = active && active.dataset && active.dataset.act ? '[data-act="' + active.dataset.act + '"]' + (active.dataset.id ? '[data-id="' + active.dataset.id + '"]' : '') : null;
  // top right: profile badge (name shows on hover) and cart count
  const name = cid ? custs[cid].name : '';
  $('#account').innerHTML = cid ?
    '<button class="badge in" data-act="profile-open" aria-label="Profile: ' + esc(name) + '">' + esc(name[0].toUpperCase()) + '<span class="tip" aria-hidden="true">' + esc(name) + '</span></button>' :
    '<button class="badge" data-act="login-open" aria-label="Log in">' + ico('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', 22) + '<span class="tip" aria-hidden="true">Log in</span></button>';
  const cartN = cid ? cartOf(cid).reduce((s, l) => s + l.qty, 0) : 0, wishN = cid ? wishOf(cid).length : 0;
  $('#n-cart').hidden = cartN === 0; $('#n-cart').textContent = cartN;
  $('#n-wish').hidden = wishN === 0; $('#n-wish').textContent = wishN;
  document.querySelectorAll('.dock [data-view]').forEach(b => b.setAttribute('aria-current', (b.dataset.view === state.view || (b.dataset.view === 'home' && state.view === 'shop')) ? 'page' : 'false'));
  $('.dock [data-act="profile-open"]').setAttribute('aria-current', state.view === 'profile' ? 'page' : 'false');
  const views = { home: homeView, shop: shopView, wishlist: wishView, orders: ordersView, profile: profileView };
  $('#main').innerHTML = (views[state.view] || homeView)();
  // overlays (keep the scroll position while the same dialog is redrawn)
  const key = state.overlay ? state.overlay + (state.modal ? state.modal.pid : '') : '';
  const ov = $('#overlay'), oldBox = ov.querySelector('[tabindex="-1"]');
  const keepTop = oldBox && key && key === lastOverlayKey ? oldBox.scrollTop : 0;
  ov.innerHTML = state.overlay === 'product' ? productDialog() : state.overlay === 'cart' ? cartDrawer() : state.overlay === 'checkout' ? checkoutDialog() : state.overlay === 'confirm' ? confirmDialog() : state.overlay === 'menu' ? menuDrawer() : state.overlay === 'login' ? loginDialog() : state.overlay === 'signup' ? signupDialog() : '';
  document.body.classList.toggle('locked', !!state.overlay);
  const box = ov.querySelector('[tabindex="-1"]');
  if (box && keepTop) box.scrollTop = keepTop;
  if (key && key !== lastOverlayKey) { const first = (state.overlay === 'login' || state.overlay === 'signup') && box ? box.querySelector('input') : null; if (first || box) (first || box).focus(); }
  else if (keep && state.overlay) { const el = ov.querySelector(keep); if (el) el.focus(); }
  else if (keep) { const el = document.querySelector(keep); if (el) el.focus(); }
  lastOverlayKey = key;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function closeOverlay() { state.overlay = null; state.modal = null; state.checkout = null; state.couponMsg = ''; }
function showView(v) { state.view = v; closeOverlay(); render(); window.scrollTo(0, 0); }

// ---------- actions ----------
const newForm = () => ({ name: '', email: '', phone: '', password: '', confirm: '', error: '', notice: '' });
function needLogin(msg) { state.form = newForm(); state.form.notice = msg; state.modal = null; state.overlay = 'login'; render(); }
function doLogin() {
  const f = state.form, email = f.email.trim().toLowerCase();
  if (!email || !f.password) { f.error = 'Enter your email and password.'; render(); return; }
  const c = Object.values(custs).find(x => x.email.toLowerCase() === email);
  if (!c || state.passwords[c.id] !== f.password) { f.error = 'The email or password is not right.'; render(); return; }
  state.customerId = c.id; state.coupon = null; state.couponInput = ''; closeOverlay(); render();
  toast('Welcome back, ' + c.name.split(' ')[0]);
}
function doSignup() {
  const f = state.form, name = f.name.trim(), email = f.email.trim().toLowerCase();
  if (!name || !email || !f.password) f.error = 'Fill in your name, email and password.';
  else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) f.error = 'Enter a valid email address.';
  else if (Object.values(custs).some(x => x.email.toLowerCase() === email)) f.error = 'An account with this email already exists. Try logging in.';
  else if (f.password.length < 8) f.error = 'Use at least 8 characters for the password.';
  else if (f.password !== f.confirm) f.error = 'The two passwords do not match.';
  else {
    const id = Math.max.apply(null, Object.keys(custs).map(Number)) + 1;
    custs[id] = { id: id, name: name, email: email, phone: f.phone.trim() };
    state.passwords[id] = f.password; state.carts[id] = []; state.wish[id] = [];   // every customer gets one cart
    state.customerId = id; closeOverlay(); render();
    toast('Account created. Welcome, ' + name.split(' ')[0]); return;
  }
  render();
}
function logout() { state.customerId = null; state.coupon = null; state.couponInput = ''; showView('home'); toast('Logged out'); }
function openProduct(pid) {
  const vs = variantsOf(pid), first = vs.find(v => state.stock[v.id] > 0) || vs[0];
  state.modal = { pid: pid, vid: first.id, img: 0, qty: 1, rating: '', text: '', reviewError: '' };
  state.overlay = 'product'; render();
}
function toggleWish(pid) {
  if (!state.customerId) { needLogin('Log in to save products to your wishlist.'); return; }
  const w = wishOf(state.customerId), i = w.indexOf(pid);
  if (i >= 0) { w.splice(i, 1); toast('Removed from wishlist'); } else { w.push(pid); toast('Saved to wishlist'); }
  render();
}
function addToCart() {
  if (!state.customerId) { needLogin('Log in to add items to your cart.'); return; }
  const m = state.modal, cart = cartOf(state.customerId), line = cart.find(l => l.variantId === m.vid);
  const room = state.stock[m.vid] - (line ? line.qty : 0);
  if (room <= 0) { toast('Your cart already has all the stock of this style'); return; }
  const add = Math.min(m.qty, room);
  if (line) line.qty += add; else cart.push({ variantId: m.vid, qty: add });   // the same style is never added twice as two lines
  toast(add < m.qty ? 'Added ' + add + ', that is all we have' : 'Added to cart');
  render();
}
function changeLine(vid, delta) {
  const cart = cartOf(state.customerId), line = cart.find(l => l.variantId === vid);
  if (!line) return;
  const next = line.qty + delta;
  if (next < 1) return;
  if (next > state.stock[vid]) { toast('Only ' + state.stock[vid] + ' in stock'); return; }
  line.qty = next; render();
}
function applyCoupon() {
  const code = state.couponInput.trim().toLowerCase();
  const c = DB.coupons.find(x => x.code.toLowerCase() === code);
  if (!code) state.couponMsg = 'Type a coupon code first.';
  else if (!c) state.couponMsg = 'That code does not exist.';
  else if (new Date(c.expiry + 'T23:59:59') < new Date()) state.couponMsg = 'Code ' + c.code + ' expired on ' + fmtDate(c.expiry) + '.';
  else { state.coupon = c; state.couponMsg = ''; state.couponInput = ''; toast('Code applied'); }
  render();
}
function openCheckout() {
  const mine = state.addresses.filter(a => a.customerId === state.customerId);
  state.checkout = { addressId: mine.length ? mine[0].id : 'new', method: METHODS[0], line1: '', city: '', postal: '', country: 'Pakistan', error: '' };
  state.overlay = 'checkout'; render();
}
function placeOrder() {
  const c = state.checkout, lines = cartLines(), cid = state.customerId;
  if (!lines.length) { c.error = 'Your cart is empty.'; render(); return; }
  for (const l of lines) if (l.qty > state.stock[l.variantId]) { c.error = 'Not enough stock for ' + l.p.name + '. Lower the quantity in your cart.'; render(); return; }
  let addressId = Number(c.addressId);
  if (c.addressId === 'new') {
    if (!c.line1.trim() || !c.city.trim() || !c.country.trim()) { c.error = 'Fill in street address, city and country.'; render(); return; }
    addressId = Math.max.apply(null, state.addresses.map(a => a.id)) + 1;
    state.addresses.push({ id: addressId, customerId: cid, line1: c.line1.trim(), city: c.city.trim(), postalCode: c.postal.trim(), country: c.country.trim() });
  }
  const t = totals(lines, state.coupon), id = Math.max.apply(null, state.orders.map(o => o.id)) + 1, now = new Date().toISOString();
  state.orders.push({ id: id, customerId: cid, couponId: state.coupon ? state.coupon.id : null, date: now, status: 'Processing', total: t.total });
  lines.forEach(l => { state.items.push({ orderId: id, variantId: l.variantId, qty: l.qty, unitPrice: l.price }); state.stock[l.variantId] -= l.qty; });
  state.payments.push({ orderId: id, method: c.method, amount: t.total, status: c.method === 'Cash on Delivery' ? 'Pending' : 'Completed', date: now });
  state.shipments.push({ orderId: id, addressId: addressId, carrier: null, tracking: null, status: 'Processing', shipped: null, delivered: null });
  state.carts[cid] = []; state.coupon = null; state.checkout = null; state.modal = null;
  state.confirmId = id; state.overlay = 'confirm'; render();
}
function cancelOrder(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o || (o.status !== 'Pending' && o.status !== 'Processing')) return;
  o.status = 'Cancelled';
  state.shipments.filter(s => s.orderId === id).forEach(s => { s.status = 'Cancelled'; });
  state.payments.filter(p => p.orderId === id && p.status === 'Completed').forEach(p => { p.status = 'Refunded'; });
  state.items.filter(i => i.orderId === id).forEach(i => { state.stock[i.variantId] += i.qty; });
  toast('Order cancelled'); render();
}
function postReview() {
  if (!state.customerId) { needLogin('Log in to write a review.'); return; }
  const m = state.modal, rating = Number(m.rating), text = (m.text || '').trim();
  if (!rating || !text) { m.reviewError = 'Choose a rating and write a short comment.'; render(); return; }
  state.reviews.push({ productId: m.pid, customerId: state.customerId, rating: rating, comment: text });
  m.rating = ''; m.text = ''; m.reviewError = ''; toast('Review posted'); render();
}
function clearSearch() { state.query = ''; $('#q').value = ''; }

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id);
  switch (act) {
    case 'nav':
      if (el.dataset.view === 'shop') { state.cat = 0; clearSearch(); }
      showView(el.dataset.view); break;
    case 'menu-open': state.modal = null; state.menuOpen = {}; if (state.cat) state.menuOpen[topOf(state.cat).id] = true; state.overlay = 'menu'; render(); break;
    case 'menu-toggle': state.menuOpen[id] = !state.menuOpen[id]; render(); break;
    case 'menu-cat': state.cat = id; clearSearch(); showView('shop'); break;
    case 'clear-cat': state.cat = 0; render(); break;
    case 'clear-q': clearSearch(); render(); break;
    case 'clear': state.cat = 0; clearSearch(); render(); break;
    case 'profile-open': if (!state.customerId) needLogin('Log in to see your profile.'); else showView('profile'); break;
    case 'open': openProduct(id); break;
    case 'wish': toggleWish(id); break;
    case 'backdrop': if (e.target === el) { closeOverlay(); render(); } break;
    case 'close': closeOverlay(); render(); break;
    case 'thumb': state.modal.img = id; render(); break;
    case 'variant': state.modal.vid = id; state.modal.qty = 1; render(); break;
    case 'qty-dec': state.modal.qty = Math.max(1, state.modal.qty - 1); render(); break;
    case 'qty-inc': state.modal.qty = Math.min(Math.max(1, state.stock[state.modal.vid]), state.modal.qty + 1); render(); break;
    case 'add': addToCart(); break;
    case 'review': postReview(); break;
    case 'cart-open': if (!state.customerId) { needLogin('Log in to see your cart.'); break; } state.overlay = 'cart'; state.modal = null; render(); break;
    case 'login-open': state.form = newForm(); state.modal = null; state.overlay = 'login'; render(); break;
    case 'signup-open': state.form = newForm(); state.modal = null; state.overlay = 'signup'; render(); break;
    case 'login': doLogin(); break;
    case 'signup': doSignup(); break;
    case 'logout': logout(); break;
    case 'line-inc': changeLine(id, 1); break;
    case 'line-dec': changeLine(id, -1); break;
    case 'line-remove': state.carts[state.customerId] = cartOf(state.customerId).filter(l => l.variantId !== id); render(); break;
    case 'coupon-apply': applyCoupon(); break;
    case 'coupon-remove': state.coupon = null; render(); break;
    case 'checkout-open': openCheckout(); break;
    case 'place': placeOrder(); break;
    case 'cancel-order': cancelOrder(id); break;
    case 'go-orders': showView('orders'); break;
  }
});
function setPath(path, val) {
  const keys = path.split('.'); let o = state;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = val;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    state.query = t.value; closeOverlay();
    if (state.view !== 'shop') state.view = 'shop';
    render(); return;
  }
  if (t.dataset.bind && t.tagName !== 'SELECT' && t.type !== 'radio') setPath(t.dataset.bind, t.value);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind) { setPath(t.dataset.bind, t.value); if (t.type === 'radio' || t.tagName === 'SELECT') render(); }
});
document.addEventListener('keydown', e => {
  if (!state.overlay) return;
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter !== undefined) { e.preventDefault(); const b = $('#overlay [data-primary]'); if (b) b.click(); return; }
  if (e.key === 'Escape') { closeOverlay(); render(); return; }
  if (e.key === 'Tab') {
    const box = $('#overlay [tabindex="-1"]'); if (!box) return;
    const f = box.querySelectorAll('button:not([disabled]),input,select,textarea,[href]');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ---------- start ----------
render();
})();
</script>
