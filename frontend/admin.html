<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopSphere Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">
<header class="top">
  <button class="logo" data-act="tab" data-tab="orders">ShopSphere <small>Admin</small></button>
  <div class="top-right"><div class="admin-user" id="admin-user"></div><a class="shop-link" href="index.html">Back to the shop</a></div>
</header>
<nav class="tabs" aria-label="Admin sections" hidden>
  <button class="tab" data-act="tab" data-tab="orders">Orders</button>
  <button class="tab" data-act="tab" data-tab="products">Products and stock</button>
  <button class="tab" data-act="tab" data-tab="reports">Reports</button>
</nav>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This page needs JavaScript.</noscript>

<script src="api.js"></script>
<script>
/*
  ShopSphere admin pages. Everything goes through the API (api.js) to SQL Server.
  First the admin logs in:
      POST  /api/admin/login                   email + password (Admin table) -> a token
      GET   /api/admin/me                      after a refresh: is the saved token still valid?
      POST  /api/admin/logout                  forget the token
  The token is kept in this browser tab (sessionStorage) and sent with every request
  (api.setToken). Without it, every /api/admin request below is refused with 401.
      GET   /api/admin/orders                  every order, from the view vw_OrderSummary
      GET   /api/orders/:id                    one order's items and payment attempts
      PATCH /api/admin/payments/:id            Pending -> Completed (paid) or Failed
      PATCH /api/admin/orders/:id/shipment     Shipped (carrier, tracking) or Delivered
      POST  /api/orders/:id/cancel             cancel an order (one transaction in the API)
      GET   /api/products, /categories, /sellers   the product list (vw_ProductCatalog) and the form choices
      GET   /api/products/:id                  one product's variants
      POST  /api/admin/products                add a product
      POST  /api/admin/products/:id/variants   add a variant (size, colour, SKU, price, stock)
      PATCH /api/admin/variants/:id/stock      restock (+25) or correct (-3) a variant's stock
      GET   /api/admin/reports/...             the five sales reports (the proposal's sample queries):
            top-products, customer-spending, monthly-revenue, category-performance, low-stock?threshold=
  The payment and shipment updates also run in transactions in the API, so the order's
  status always changes together with its payment or shipment.
  Passwords are not hashed: the proposal lists production-grade security as out of scope.
*/
(function () {
'use strict';

const $ = s => document.querySelector(s);
const STATUSES = ['Pending', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];
const CARRIERS = ['TCS', 'Leopards', 'M&P', 'PostEx', 'Trax'];

const TOKEN_KEY = 'shopsphere-admin-token';   // sessionStorage: forgotten when the tab closes

const state = {
  // logging in
  checked: false,                 // has the page checked for a saved login yet?
  admin: null,                    // the logged-in admin: { AdminID, Name, Email }
  loginForm: { email: '', password: '', error: '', notice: '', busy: false },
  tab: 'orders',
  orders: [], loaded: false, loadError: '',
  filter: '',                     // '' = all, or one order status
  items: {},                      // OrderID -> GET /api/orders/:id result, while "Show items" is open
  shipping: null,                 // the ship form: { orderId, carrier, tracking, error }
  cancelAsk: null,                // OrderID whose "Are you sure?" is showing
  // products tab
  products: [], cats: [], sellers: [], prodLoaded: false, prodError: '',
  prodQuery: '',                  // the search box above the product list
  addForm: null,                  // the add-product form: { name, description, categoryId, sellerId, basePrice, error }
  manage: null,                   // the open product: { pid, detail, change: { VariantID: '25' }, stockError, variant: {...} }
  // reports tab
  reports: null, repError: '',    // { top, spend, months, cats, low } from the five report endpoints
  threshold: '10',                // the low-stock report's "fewer than" number
  monthTable: false               // show the monthly revenue as a table instead of columns
};

// ---------- loading ----------
async function loadOrders() {
  try {
    state.orders = await api.get('/admin/orders');
    state.loaded = true; state.loadError = '';
  } catch (e) { state.loadError = e.message; }
  render();
}
async function loadItems(orderId) {
  try { state.items[orderId] = await api.get('/orders/' + orderId); }
  catch (e) { delete state.items[orderId]; toast(e.message); }
  render();
}

// ---------- orders tab ----------
const chip = s => '<span class="chip s-' + esc(s) + '">' + esc(s) + '</span>';

// Which buttons an order gets, following the proposal's workflow:
//   payment: Pending -> Completed (paid) or Failed
//   order:   Pending -> Processing (when paid) -> Shipped -> Delivered, or Cancelled before shipping
// An order ships once it is paid, or straight away when the customer pays cash on delivery.
function actionsFor(o) {
  const out = [];
  const open = o.OrderStatus === 'Pending' || o.OrderStatus === 'Processing';
  if (o.PaymentStatus === 'Pending' && o.OrderStatus !== 'Cancelled') {
    out.push('<button class="btn primary" data-act="pay" data-id="' + o.PaymentID + '" data-status="Completed">Mark paid</button>');
    out.push('<button class="btn" data-act="pay" data-id="' + o.PaymentID + '" data-status="Failed">Payment failed</button>');
  }
  const paidOrCod = o.PaymentStatus === 'Completed' || (o.PaymentMethod === 'Cash on Delivery' && o.PaymentStatus === 'Pending');
  if (open && paidOrCod) out.push('<button class="btn" data-act="ship-open" data-id="' + o.OrderID + '">Ship…</button>');
  if (open && !paidOrCod) out.push('<span class="muted">Ships once paid</span>');
  if (o.OrderStatus === 'Shipped') out.push('<button class="btn primary" data-act="deliver" data-id="' + o.OrderID + '">Mark delivered</button>');
  if (open) out.push('<button class="btn danger" data-act="cancel-ask" data-id="' + o.OrderID + '">Cancel order</button>');
  out.push('<button class="link" data-act="items" data-id="' + o.OrderID + '">' + (state.items[o.OrderID] ? 'Hide items' : 'Show items') + '</button>');
  return out.join('');
}

function shipForm(o) {
  const f = state.shipping;
  return '<div class="ship-form">' +
    '<div class="field"><label for="carrier"><span>Carrier</span></label><select id="carrier" data-bind="shipping.carrier">' +
      CARRIERS.map(c => '<option' + (f.carrier === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label for="tracking"><span>Tracking number</span></label><input id="tracking" data-bind="shipping.tracking" value="' + esc(f.tracking) + '" placeholder="e.g. TRK-' + o.OrderID + '"></div>' +
    '<button class="btn primary" data-act="ship" data-id="' + o.OrderID + '">Mark shipped</button>' +
    '<button class="btn" data-act="ship-close">Back</button>' +
    (f.error ? '<p class="err" style="flex-basis:100%">' + esc(f.error) + '</p>' : '') +
  '</div>';
}

function itemsTable(d) {
  return '<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Total</th></tr></thead><tbody>' +
    d.items.map(i => '<tr><td>' + esc(i.ProductName) + ' <span class="muted">(' + esc(i.SKU) + ')</span></td><td class="r">' + i.Quantity + '</td><td class="r">' + money(i.UnitPrice) + '</td><td class="r">' + money(i.LineTotal) + '</td></tr>').join('') +
    '</tbody></table>' +
    (d.payments.length > 1 ? '<p class="arow-meta">Payment attempts: ' + d.payments.map(p => esc(p.Method) + ' ' + chip(p.Status)).join(', ') + '</p>' : '');
}

function orderRow(o) {
  const asking = state.cancelAsk === o.OrderID;
  const shipping = state.shipping && state.shipping.orderId === o.OrderID;
  return '<section class="arow">' +
    '<div class="arow-head"><h2>Order ' + o.OrderID + '</h2><span class="muted">' + fmtDate(o.OrderDate) + '</span>' + chip(o.OrderStatus) +
      '<span class="total">' + money(o.TotalAmount) + '</span></div>' +
    '<p class="arow-meta">' + esc(o.CustomerName) + ' (' + esc(o.CustomerEmail) + ') · ' + o.ItemCount + ' item' + (o.ItemCount === 1 ? '' : 's') +
      (o.CouponCode ? ' · coupon ' + esc(o.CouponCode) + ' (−' + money(o.Discount) + ')' : '') + (o.ShipToCity ? ' · to ' + esc(o.ShipToCity) : '') + '</p>' +
    '<div class="arow-status"><span>Payment: ' + esc(o.PaymentMethod || '—') + ' ' + (o.PaymentStatus ? chip(o.PaymentStatus) : '') + '</span>' +
      '<span>Shipment: ' + (o.ShipmentStatus ? chip(o.ShipmentStatus) : '—') + (o.Carrier ? ' ' + esc(o.Carrier) + (o.TrackingNumber ? ', ' + esc(o.TrackingNumber) : '') : '') + '</span></div>' +
    (state.items[o.OrderID] ? itemsTable(state.items[o.OrderID]) : '') +
    (asking ?
      '<div class="actions"><span>Cancel order ' + o.OrderID + '? Stock goes back and a completed payment is refunded.</span>' +
        '<button class="btn danger" data-act="cancel-yes" data-id="' + o.OrderID + '">Yes, cancel it</button><button class="btn" data-act="cancel-no">Keep the order</button></div>' :
      shipping ? shipForm(o) : '<div class="actions">' + actionsFor(o) + '</div>') +
  '</section>';
}

function ordersTab() {
  if (state.loadError) return '<div class="empty"><h2>Orders could not load</h2><p>' + esc(state.loadError) + '</p><button class="btn primary" data-act="retry">Try again</button></div>';
  if (!state.loaded) return '<p class="loading">Loading orders…</p>';
  const count = s => state.orders.filter(o => o.OrderStatus === s).length;
  const list = state.filter ? state.orders.filter(o => o.OrderStatus === state.filter) : state.orders;
  return '<div class="shop-head"><h1>Orders</h1></div>' +
    '<p class="admin-note">Every order in the database, newest first. Each change here is saved in SQL Server straight away.</p>' +
    '<div class="filters-bar" role="group" aria-label="Show orders">' +
      '<button class="filter" data-act="filter" data-status="" aria-pressed="' + (!state.filter) + '">All<span>' + state.orders.length + '</span></button>' +
      STATUSES.map(s => '<button class="filter" data-act="filter" data-status="' + s + '" aria-pressed="' + (state.filter === s) + '">' + s + '<span>' + count(s) + '</span></button>').join('') +
    '</div>' +
    (list.length ? list.map(orderRow).join('') : '<p class="muted">No ' + esc(state.filter.toLowerCase()) + ' orders.</p>');
}

// ---------- products tab ----------
async function loadProducts() {
  try {
    const [rows, cats, sellers] = await Promise.all([api.get('/products'), api.get('/categories'), api.get('/sellers')]);
    state.products = rows; state.cats = cats; state.sellers = sellers;
    state.prodLoaded = true; state.prodError = '';
  } catch (e) { state.prodError = e.message; }
  render();
}
// "Electronics / Laptops" for a subcategory, "Books" for a main category.
function catLabel(id) {
  const c = state.cats.find(x => x.CategoryID === id);
  if (!c) return '';
  const parent = state.cats.find(x => x.CategoryID === c.ParentCategoryID);
  return (parent ? parent.Name + ' / ' : '') + c.Name;
}
const priceRange = p => p.MinPrice == null ? money(p.BasePrice) + ' <span class="muted">(base)</span>'
  : Number(p.MinPrice) === Number(p.MaxPrice) ? money(p.MinPrice) : money(p.MinPrice) + ' – ' + money(p.MaxPrice);
const field = (id, label, bind, value, type, extra) => '<div class="field' + (extra || '') + '"><label for="' + id + '"><span>' + label + '</span></label><input id="' + id + '" type="' + (type || 'text') + '" data-bind="' + bind + '" value="' + esc(value) + '"></div>';

function addProductForm() {
  const f = state.addForm;
  const cats = state.cats.slice().sort((a, b) => catLabel(a.CategoryID).localeCompare(catLabel(b.CategoryID)));
  return '<section class="form-card"><h2>Add a product</h2><p class="muted">After adding it, add its first variant (size, colour, SKU, price and stock) so customers can buy it.</p>' +
    '<div class="form-grid">' +
      field('np-name', 'Name', 'addForm.name', f.name) +
      '<div class="field"><label for="np-cat"><span>Category</span></label><select id="np-cat" data-bind="addForm.categoryId"><option value="">Choose a category</option>' +
        cats.map(c => '<option value="' + c.CategoryID + '"' + (String(f.categoryId) === String(c.CategoryID) ? ' selected' : '') + '>' + esc(catLabel(c.CategoryID)) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="np-seller"><span>Seller</span></label><select id="np-seller" data-bind="addForm.sellerId"><option value="">Choose a seller</option>' +
        state.sellers.map(s => '<option value="' + s.SellerID + '"' + (String(f.sellerId) === String(s.SellerID) ? ' selected' : '') + '>' + esc(s.StoreName) + '</option>').join('') + '</select></div>' +
      field('np-price', 'Base price (Rs)', 'addForm.basePrice', f.basePrice, 'number') +
      '<div class="field wide"><label for="np-desc"><span>Description (optional)</span></label><textarea id="np-desc" rows="2" data-bind="addForm.description">' + esc(f.description) + '</textarea></div>' +
    '</div>' +
    (f.error ? '<p class="err" id="np-err">' + esc(f.error) + '</p>' : '') +
    '<div class="row"><button class="btn primary" data-act="add-product">Add product</button><button class="btn" data-act="add-cancel">Cancel</button></div></section>';
}

// The open product: its variants with a stock box each, and the add-variant form.
function managePanel(p) {
  const m = state.manage;
  if (!m.detail) return '<tr class="panel"><td colspan="7"><p class="loading" style="margin:16px 0">Loading variants…</p></td></tr>';
  const vs = m.detail.variants, f = m.variant;
  const table = vs.length ?
    '<table><thead><tr><th>SKU</th><th>Size</th><th>Colour</th><th class="r">Price</th><th class="r">Stock</th><th>Restock (+) or correct (−)</th></tr></thead><tbody>' +
      vs.map(v => '<tr><td><b>' + esc(v.SKU) + '</b></td><td data-label="Size">' + esc(v.Size || '—') + '</td><td data-label="Colour">' + esc(v.Color || '—') + '</td><td class="r" data-label="Price">' + money(v.Price) + '</td>' +
        '<td class="r' + (v.StockQty < 10 ? ' low' : '') + '" data-label="Stock">' + v.StockQty + '</td>' +
        '<td><div class="stock-change"><input type="number" step="1" id="chg-' + v.VariantID + '" data-bind="manage.change.' + v.VariantID + '" value="' + esc(m.change[v.VariantID] || '') + '" placeholder="e.g. 25" aria-label="Stock change for ' + esc(v.SKU) + '">' +
        '<button class="btn" data-act="stock" data-id="' + v.VariantID + '">Update</button></div></td></tr>').join('') + '</tbody></table>' :
    '<p class="err" style="margin:10px 0">No variants yet, so customers cannot buy this product. Add the first one below.</p>';
  return '<tr class="panel"><td colspan="7">' +
    (m.stockError ? '<p class="err">' + esc(m.stockError) + '</p>' : '') + table +
    '<b>Add a variant</b>' +
    '<div class="form-grid">' +
      field('nv-sku', 'SKU (unique code)', 'manage.variant.sku', f.sku) + field('nv-size', 'Size (optional)', 'manage.variant.size', f.size) +
      field('nv-color', 'Colour (optional)', 'manage.variant.color', f.color) + field('nv-price', 'Price (Rs)', 'manage.variant.price', f.price, 'number') +
      field('nv-stock', 'Stock', 'manage.variant.stock', f.stock, 'number') +
    '</div>' +
    (f.error ? '<p class="err" id="nv-err">' + esc(f.error) + '</p>' : '') +
    '<button class="btn primary" data-act="add-variant" data-id="' + p.ProductID + '">Add variant</button>' +
  '</td></tr>';
}

function productsTab() {
  if (state.prodError) return '<div class="empty"><h2>Products could not load</h2><p>' + esc(state.prodError) + '</p><button class="btn primary" data-act="retry-products">Try again</button></div>';
  if (!state.prodLoaded) return '<p class="loading">Loading products…</p>';
  const q = state.prodQuery.trim().toLowerCase();
  const list = state.products.filter(p => !q || p.ProductName.toLowerCase().includes(q) || catLabel(p.CategoryID).toLowerCase().includes(q) || p.SellerName.toLowerCase().includes(q))
    .sort((a, b) => a.ProductName.localeCompare(b.ProductName));
  const low = state.products.filter(p => p.TotalStock < 10).length;
  const row = p => {
    const open = state.manage && state.manage.pid === p.ProductID;
    return '<tr data-pid="' + p.ProductID + '"' + (open ? ' class="open"' : '') + '><td><b>' + esc(p.ProductName) + '</b><span class="sub">' + esc(catLabel(p.CategoryID)) + ' · ' + esc(p.SellerName) + ' · ' + p.VariantCount + ' variant' + (p.VariantCount === 1 ? '' : 's') + '</span></td>' +
      '<td class="c-cat">' + esc(catLabel(p.CategoryID)) + '</td><td class="c-seller">' + esc(p.SellerName) + '</td>' +
      '<td class="r">' + priceRange(p) + '</td><td class="r c-var">' + p.VariantCount + '</td><td class="r' + (p.TotalStock < 10 ? ' low' : '') + '">' + p.TotalStock + '</td>' +
      '<td><button class="btn" data-act="manage" data-id="' + p.ProductID + '">' + (open ? 'Close' : 'Manage') + '</button></td></tr>' + (open ? managePanel(p) : '');
  };
  return '<div class="shop-head"><h1>Products and stock</h1></div>' +
    '<p class="admin-note">' + state.products.length + ' products (from the view vw_ProductCatalog), ' + low + ' with less than 10 in stock. Stock is kept per variant (size and colour).</p>' +
    '<div class="toolbar-admin"><label class="sr" for="psearch">Search products</label><input id="psearch" type="search" placeholder="Search by name, category or seller" data-bind="prodQuery" value="' + esc(state.prodQuery) + '">' +
      (state.addForm ? '' : '<button class="btn primary" data-act="add-open">Add a product</button>') +
      (q ? '<span class="muted">' + list.length + ' found</span>' : '') + '</div>' +
    (state.addForm ? addProductForm() : '') +
    (list.length ?
      '<div class="table-wrap"><table class="ptable"><thead><tr><th>Product</th><th class="c-cat">Category</th><th class="c-seller">Seller</th><th class="r">Price</th><th class="r c-var">Variants</th><th class="r">Stock</th><th></th></tr></thead><tbody>' + list.map(row).join('') + '</tbody></table></div>' :
      '<p class="muted">No products match.</p>');
}

// ---------- reports tab ----------
// Loaded again every time the tab opens, because orders change the numbers.
async function loadReports() {
  try {
    const r = '/admin/reports/';
    const [top, spend, months, cats, low] = await Promise.all([api.get(r + 'top-products'), api.get(r + 'customer-spending'),
      api.get(r + 'monthly-revenue'), api.get(r + 'category-performance'), api.get(r + 'low-stock?threshold=' + Number(state.threshold))]);
    state.reports = { top: top, spend: spend, months: months, cats: cats, low: low }; state.repError = '';
  } catch (e) { state.repError = e.message; }
  render();
}
async function loadLowStock() {
  const n = Number(state.threshold);
  if (!Number.isInteger(n) || n < 1) { toast('Type a whole number of 1 or more.'); return; }
  state.reports.low = await api.get('/admin/reports/low-stock?threshold=' + n);
  render();
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// 1,234 / 12K / 1.2M for axis labels
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(Math.round(n));
// The top of the axis: the next clean number (1, 2 or 5 times a power of ten) above the biggest value.
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
// The report skips months without orders; put them back as zero so the time axis stays even.
function everyMonth(rows) {
  if (!rows.length) return [];
  const key = r => r.OrderYear * 12 + r.OrderMonth - 1, byKey = {};
  rows.forEach(r => { byKey[key(r)] = r; });
  const out = [];
  for (let k = key(rows[0]); k <= key(rows[rows.length - 1]); k++) {
    out.push(byKey[k] || { OrderYear: Math.floor(k / 12), OrderMonth: k % 12 + 1, Orders: 0, Revenue: 0 });
  }
  return out;
}
// A hover/focus tooltip reads data-tip-value and data-tip-label (see the events below).
const tipAttrs = (value, label) => ' tabindex="0" data-tip-value="' + esc(value) + '" data-tip-label="' + esc(label) + '"';

// Ranked bars: one row per item with its name, a bar (length = value) and the figure.
function rankList(rows, name, sub, value, shown) {
  if (!rows.length) return '<p class="muted">Nothing to show yet.</p>';
  const max = Math.max.apply(null, rows.map(value)) || 1;
  return '<ol class="rank">' + rows.map(r =>
    '<li' + tipAttrs(shown(r), name(r) + (sub ? ' · ' + sub(r) : '')) + '><span class="name">' + esc(name(r)) + (sub ? '<small>' + esc(sub(r)) + '</small>' : '') + '</span>' +
    '<span class="track"><span class="fill" style="width:' + (value(r) / max * 100).toFixed(1) + '%"></span></span><span class="val">' + esc(shown(r)) + '</span></li>').join('') + '</ol>';
}

// Revenue per month as columns, with the highest and the latest month labelled.
function monthChart(rows) {
  if (!rows.length) return '<p class="muted">No orders yet.</p>';
  const top = niceMax(Math.max.apply(null, rows.map(r => Number(r.Revenue))));
  const best = rows.reduce((a, b) => Number(b.Revenue) > Number(a.Revenue) ? b : a), last = rows[rows.length - 1];
  const name = r => MONTHS[r.OrderMonth - 1] + ' ' + r.OrderYear;
  return '<div class="cols" role="img" aria-label="Revenue per month; the table view lists every value">' +
      [0, 0.5, 1].map(f => '<div class="gl' + (f === 0 ? ' base' : '') + '" style="bottom:' + (f * 100) + '%"><span>Rs ' + compact(top * f) + '</span></div>').join('') +
      '<div class="bars">' + rows.map(r => {
        const pct = (Number(r.Revenue) / top * 100).toFixed(1);
        return '<div class="col"' + tipAttrs(money(r.Revenue), name(r) + ' · ' + r.Orders + ' order' + (r.Orders === 1 ? '' : 's')) + '><i style="height:' + pct + '%"></i>' +
          (r === best || r === last ? '<em style="bottom:' + pct + '%">Rs ' + compact(Number(r.Revenue)) + '</em>' : '') + '</div>';
      }).join('') + '</div>' +
    '</div><div class="cols-x" aria-hidden="true">' + rows.map(r => '<span>' + MONTHS[r.OrderMonth - 1] + '</span>').join('') + '</div>';
}
function monthTable(rows) {
  return '<table class="data"><thead><tr><th>Month</th><th class="r">Orders</th><th class="r">Revenue</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + MONTHS[r.OrderMonth - 1] + ' ' + r.OrderYear + '</td><td class="r">' + r.Orders + '</td><td class="r">' + money(r.Revenue) + '</td></tr>').join('') + '</tbody></table>';
}

function reportsTab() {
  if (state.repError) return '<div class="empty"><h2>Reports could not load</h2><p>' + esc(state.repError) + '</p><button class="btn primary" data-act="retry-reports">Try again</button></div>';
  if (!state.reports) return '<p class="loading">Loading reports…</p>';
  const R = state.reports, months = everyMonth(R.months);
  const revenue = R.months.reduce((s, m) => s + Number(m.Revenue), 0), orders = R.months.reduce((s, m) => s + m.Orders, 0);
  const units = R.top.reduce((s, t) => s + t.UnitsSold, 0);
  const kpi = (label, value) => '<div class="kpi"><span>' + label + '</span><b>' + value + '</b></div>';
  const period = months.length ? MONTHS[months[0].OrderMonth - 1] + ' ' + months[0].OrderYear + ' to ' + MONTHS[last(months).OrderMonth - 1] + ' ' + last(months).OrderYear : '';
  const variantName = v => [v.Size, v.Color].filter(x => x && x !== 'N/A' && x !== 'Standard').join(', ');
  return '<div class="shop-head"><h1>Reports</h1></div>' +
    '<p class="admin-note">The proposal\'s sample queries, run live on the database. Cancelled orders are left out of every sales figure.</p>' +
    '<div class="kpis">' + kpi('Revenue', money(revenue)) + kpi('Orders', orders) + kpi('Average order', money(orders ? revenue / orders : 0)) + kpi('Units sold', units) + '</div>' +
    '<div class="report-grid">' +
      '<section class="report wide"><div class="report-head"><div><h2>Revenue by month</h2><p>' + period + '</p></div>' +
        '<button class="link" data-act="month-table">' + (state.monthTable ? 'Show as chart' : 'Show as table') + '</button></div>' +
        (state.monthTable ? monthTable(months) : monthChart(months)) + '</section>' +
      '<section class="report"><div class="report-head"><div><h2>Top products</h2><p>Units sold</p></div></div>' +
        rankList(R.top, t => t.Product, null, t => t.UnitsSold, t => t.UnitsSold + ' sold') + '</section>' +
      '<section class="report"><div class="report-head"><div><h2>Sales by category</h2><p>Revenue, with units sold</p></div></div>' +
        rankList(R.cats, c => c.Category, c => c.UnitsSold + ' unit' + (c.UnitsSold === 1 ? '' : 's'), c => Number(c.Revenue), c => money(c.Revenue)) + '</section>' +
      '<section class="report"><div class="report-head"><div><h2>Customer spending</h2><p>Total spent, with number of orders</p></div></div>' +
        rankList(R.spend, c => c.Customer, c => c.Orders + ' order' + (c.Orders === 1 ? '' : 's'), c => Number(c.TotalSpent), c => money(c.TotalSpent)) + '</section>' +
      '<section class="report"><div class="report-head"><div><h2>Low stock</h2><p>' + R.low.length + ' variant' + (R.low.length === 1 ? '' : 's') + ' to restock</p></div>' +
        '<div class="threshold"><label for="thr">Fewer than</label><input id="thr" type="number" min="1" step="1" data-bind="threshold" value="' + esc(state.threshold) + '"><button class="btn" data-act="low-update">Show</button></div></div>' +
        (R.low.length ?
          '<table class="data"><thead><tr><th>Product</th><th>SKU</th><th class="r">Stock</th></tr></thead><tbody>' +
            R.low.map(v => '<tr><td>' + esc(v.Product) + (variantName(v) ? ' <span class="muted">(' + esc(variantName(v)) + ')</span>' : '') + '</td><td>' + esc(v.SKU) + '</td><td class="r">' + (v.StockQty === 0 ? 'Sold out' : v.StockQty) + '</td></tr>').join('') + '</tbody></table>' :
          '<p class="muted">Every variant has at least ' + esc(state.threshold) + ' in stock.</p>') + '</section>' +
    '</div>';
}
const last = a => a[a.length - 1];

// ---------- log-in screen ----------
function loginView() {
  const f = state.loginForm;
  return '<section class="form-card login-card"><h1>Admin log in</h1>' +
    '<p class="muted">For shop staff. Admin accounts are added by the shop in the Admin table; customers cannot sign up as admins.</p>' +
    (f.notice ? '<p class="err">' + esc(f.notice) + '</p>' : '') +
    field('al-email', 'Email', 'loginForm.email', f.email, 'email') +
    field('al-pass', 'Password', 'loginForm.password', f.password, 'password') +
    (f.error ? '<p class="err" id="al-err">' + esc(f.error) + '</p>' : '') +
    '<button class="btn primary" style="width:100%;margin-top:6px" data-act="login"' + (f.busy ? ' disabled' : '') + '>' + (f.busy ? 'Logging in…' : 'Log in') + '</button>' +
    '<p class="muted" style="margin-top:14px">Sample admin: <b>admin@example.com</b> with password <b>admin_pw_001</b>.</p></section>';
}

// ---------- drawing ----------
function render() {
  // Redrawing replaces the boxes, so remember which one has the cursor and put it back.
  const a = document.activeElement, focusId = a && a.id && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) ? a.id : null;
  const caret = focusId && a.type !== 'number' && a.selectionStart != null ? a.selectionStart : null;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
  const tabs = {
    orders: ordersTab,
    products: productsTab,
    reports: reportsTab
  };
  hideTip();
  // Logged in: the admin's name and Log out in the header, the tabs, the open tab.
  // Not logged in: only the log-in screen.
  $('#admin-user').innerHTML = state.admin ? '<span class="who">' + esc(state.admin.Name) + '</span><button class="btn" data-act="logout">Log out</button>' : '';
  $('.tabs').hidden = !state.admin;
  $('#main').innerHTML = !state.checked ? '<p class="loading">Loading…</p>' : !state.admin ? loginView() : tabs[state.tab]();
  const el = focusId && document.getElementById(focusId);
  if (el) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret); }
}
// ---------- tooltip on report bars (hover or keyboard focus) ----------
// The values are also printed beside the bars or in the table view; the tooltip only adds detail.
const tip = document.createElement('div');
tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
function showTip(el, x, y) {
  tip.textContent = '';                      // built with textContent: names come from the database
  const b = document.createElement('b'); b.textContent = el.dataset.tipValue;
  const s = document.createElement('span'); s.textContent = el.dataset.tipLabel;
  tip.append(b, s); tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 12, innerWidth - w - 8)) + 'px';
  tip.style.top = Math.max(8, y - h - 12) + 'px';
}
function hideTip() { tip.style.display = 'none'; }
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('[data-tip-value]');
  if (el) showTip(el, e.clientX, e.clientY); else hideTip();
});
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip-value]');
  if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else hideTip();
});
document.addEventListener('focusout', hideTip);
addEventListener('scroll', hideTip, { passive: true });

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---------- actions ----------
// After every change: load the orders again, and the open item lists too.
async function reload() {
  await loadOrders();
  await Promise.all(Object.keys(state.items).map(id => loadItems(Number(id))));
}
// PATCH /api/admin/payments/:id. Completing a payment also moves a Pending order to Processing.
async function setPayment(paymentId, status) {
  await api.patch('/admin/payments/' + paymentId, { status: status });
  toast(status === 'Completed' ? 'Payment marked as paid' : 'Payment marked as failed');
  await reload();
}
// PATCH /api/admin/orders/:id/shipment. The order's status follows the shipment's.
async function ship(orderId) {
  const f = state.shipping;
  if (!f.tracking.trim()) { f.error = 'Enter the tracking number.'; render(); return; }
  try {
    await api.patch('/admin/orders/' + orderId + '/shipment', { status: 'Shipped', carrier: f.carrier, trackingNumber: f.tracking.trim() });
  } catch (e) { f.error = e.message; render(); return; }
  state.shipping = null; toast('Order ' + orderId + ' shipped');
  await reload();
}
async function deliver(orderId) {
  await api.patch('/admin/orders/' + orderId + '/shipment', { status: 'Delivered' });
  toast('Order ' + orderId + ' delivered');
  await reload();
}
async function cancel(orderId) {
  state.cancelAsk = null;
  await api.post('/orders/' + orderId + '/cancel');
  toast('Order ' + orderId + ' cancelled');
  await reload();
}

// ---------- products: actions ----------
const newVariant = () => ({ sku: '', size: '', color: '', price: '', stock: '0', error: '' });
async function openManage(pid) {
  state.manage = { pid: pid, detail: null, change: {}, stockError: '', variant: newVariant() };
  render();
  await loadManage();
}
async function loadManage() {
  const m = state.manage;
  try { const d = await api.get('/products/' + m.pid); if (state.manage === m) m.detail = d; }
  catch (e) { if (state.manage === m) m.stockError = e.message; }
  render();
}
// After a change: load the product list again (stock, variant counts) and the open product.
async function refreshProducts() { await loadProducts(); if (state.manage) await loadManage(); }

// POST /api/admin/products (one INSERT into Product).
async function addProduct() {
  const f = state.addForm;
  if (!f.name.trim() || !f.categoryId || !f.sellerId || f.basePrice === '') { f.error = 'Fill in the name, category, seller and base price.'; render(); return; }
  let p;
  try {
    p = await api.post('/admin/products', { name: f.name.trim(), description: f.description.trim() || null,
      categoryId: Number(f.categoryId), sellerId: Number(f.sellerId), basePrice: Number(f.basePrice) });
  } catch (e) { f.error = e.message; render(); return; }
  state.addForm = null; state.prodQuery = '';
  toast(p.Name + ' added. Now add its first variant.');
  await loadProducts();
  await openManage(p.ProductID);
  const tr = document.querySelector('tr[data-pid="' + p.ProductID + '"]'); if (tr) tr.scrollIntoView({ block: 'start' });
  const sku = document.getElementById('nv-sku'); if (sku) sku.focus();
}
// PATCH /api/admin/variants/:id/stock. The database refuses stock below zero
// (CHECK (StockQty >= 0)), which the API reports as a 400.
async function changeStock(vid) {
  const m = state.manage, raw = String(m.change[vid] || '').trim(), change = Number(raw);
  if (!raw || !Number.isInteger(change) || change === 0) { m.stockError = 'Type a whole number: 25 adds 25, -3 takes 3 away.'; render(); return; }
  try {
    const v = await api.patch('/admin/variants/' + vid + '/stock', { change: change });
    m.change[vid] = ''; m.stockError = '';
    toast(v.SKU + ': stock is now ' + v.StockQty);
  } catch (e) {
    m.stockError = e.status === 400 && change < 0 ? 'Stock cannot go below zero (the database has CHECK (StockQty >= 0)).' : e.message; render(); return;
  }
  await refreshProducts();
}
// POST /api/admin/products/:id/variants. SKU is UNIQUE, so a used SKU comes back as 409.
async function addVariant(pid) {
  const f = state.manage.variant, stock = f.stock === '' ? 0 : Number(f.stock);
  state.manage.stockError = '';              // an old stock message no longer applies
  if (!f.sku.trim() || f.price === '') { f.error = 'Fill in the SKU and the price.'; render(); return; }
  if (!Number.isInteger(stock) || stock < 0) { f.error = 'Stock must be a whole number, 0 or more.'; render(); return; }
  try {
    const v = await api.post('/admin/products/' + pid + '/variants', { sku: f.sku.trim(), size: f.size.trim() || null,
      color: f.color.trim() || null, price: Number(f.price), stockQty: stock });
    state.manage.variant = newVariant();
    toast('Variant ' + v.SKU + ' added');
  } catch (e) {
    f.error = e.status === 409 ? 'SKU ' + f.sku.trim() + ' is already used by another variant (SKU is UNIQUE).' : e.message; render(); return;
  }
  await refreshProducts();
}

// ---------- logging in and out ----------
const newLogin = notice => ({ email: '', password: '', error: '', notice: notice || '', busy: false });
function saveToken(token) {
  api.setToken(token);
  try { if (token) sessionStorage.setItem(TOKEN_KEY, token); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* private window */ }
}
// Forget everything loaded while logged in, so the next admin starts clean.
function clearData() {
  Object.assign(state, { tab: 'orders', orders: [], loaded: false, loadError: '', filter: '', items: {}, shipping: null, cancelAsk: null,
    products: [], prodLoaded: false, prodError: '', prodQuery: '', addForm: null, manage: null, reports: null, repError: '' });
}
// POST /api/admin/login -> { token, admin }
async function doLogin() {
  const f = state.loginForm, email = f.email.trim();
  if (!email || !f.password) { f.error = 'Enter your email and password.'; render(); return; }
  f.busy = true; f.error = ''; f.notice = ''; render();
  try {
    const r = await api.post('/admin/login', { email: email, password: f.password });
    saveToken(r.token);
    state.admin = r.admin; state.loginForm = newLogin(); clearData();
    render(); toast('Welcome, ' + r.admin.Name);
    loadOrders();
  } catch (e) {
    f.busy = false; f.error = e.status === 401 ? 'The email or password is not right.' : e.message; render();
  }
}
// POST /api/admin/logout, then forget the token here too.
async function logout() {
  try { await api.post('/admin/logout'); } catch (e) { /* already logged out on the API */ }
  saveToken(null); state.admin = null; clearData(); state.loginForm = newLogin();
  render(); toast('Logged out');
}
// The API refused the token (it expired, or the API was restarted): back to the log-in screen.
api.onUnauthorized = () => {
  saveToken(null); state.admin = null; clearData();
  state.loginForm = newLogin('Your admin session has ended (the API was restarted or 8 hours passed). Please log in again.');
  render();
};
// On opening the page: is there a saved token, and does the API still accept it?
async function start() {
  let saved = null;
  try { saved = sessionStorage.getItem(TOKEN_KEY); } catch (e) { /* private window */ }
  if (saved) {
    api.setToken(saved);
    try { state.admin = await api.get('/admin/me'); }
    catch (e) { saveToken(null); state.loginForm = newLogin(); }   // no "session ended" note on a fresh open
  }
  state.checked = true; render();
  if (state.admin) loadOrders();
}

// Runs one action at a time, so a double click cannot send the same change twice.
let busy = false;
async function once(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); }
  catch (e) { toast(e.message); await (state.tab === 'products' ? loadProducts() : loadOrders()); }
  finally { busy = false; }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = Number(el.dataset.id);
  switch (el.dataset.act) {
    case 'tab':
      if (!state.admin) break;                  // logged out: only the log-in screen
      state.tab = el.dataset.tab; render(); window.scrollTo(0, 0);
      if (state.tab === 'products' && !state.prodLoaded) loadProducts();
      if (state.tab === 'reports') loadReports();
      break;
    // reports tab
    case 'retry-reports': state.repError = ''; render(); loadReports(); break;
    case 'month-table': state.monthTable = !state.monthTable; render(); break;
    case 'low-update': once(loadLowStock); break;
    case 'retry': state.loadError = ''; render(); loadOrders(); break;
    case 'filter': state.filter = el.dataset.status; state.shipping = null; state.cancelAsk = null; render(); break;
    case 'items': if (state.items[id]) { delete state.items[id]; render(); } else loadItems(id); break;
    case 'pay': once(() => setPayment(id, el.dataset.status)); break;
    case 'ship-open': state.cancelAsk = null; state.shipping = { orderId: id, carrier: CARRIERS[0], tracking: '', error: '' }; render(); $('#tracking').focus(); break;
    case 'ship-close': state.shipping = null; render(); break;
    case 'ship': once(() => ship(id)); break;
    case 'deliver': once(() => deliver(id)); break;
    case 'cancel-ask': state.shipping = null; state.cancelAsk = id; render(); break;
    case 'cancel-no': state.cancelAsk = null; render(); break;
    case 'cancel-yes': once(() => cancel(id)); break;
    // logging in and out
    case 'login': once(doLogin); break;
    case 'logout': once(logout); break;
    // products tab
    case 'retry-products': state.prodError = ''; render(); loadProducts(); break;
    case 'add-open': state.addForm = { name: '', description: '', categoryId: '', sellerId: '', basePrice: '', error: '' }; render(); $('#np-name').focus(); break;
    case 'add-cancel': state.addForm = null; render(); break;
    case 'add-product': once(addProduct); break;
    case 'manage': if (state.manage && state.manage.pid === id) { state.manage = null; render(); } else openManage(id); break;
    case 'stock': once(() => changeStock(id)); break;
    case 'add-variant': once(() => addVariant(id)); break;
  }
});
// data-bind="addForm.name" means: keep state.addForm.name equal to what is typed in this box.
function setPath(path, val) {
  const keys = path.split('.'); let o = state;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = val;
}
function bind(e) {
  const t = e.target, path = t.dataset && t.dataset.bind;
  if (!path) return;
  setPath(path, t.value);
  if (path === 'prodQuery') { render(); return; }      // the product list filters as you type
  // Typing in a form hides that form's old message.
  const forms = [['shipping.', state.shipping, '.ship-form .err'], ['addForm.', state.addForm, '#np-err'], ['manage.variant.', state.manage && state.manage.variant, '#nv-err'], ['loginForm.', state.loginForm, '#al-err']];
  forms.forEach(([prefix, f, sel]) => {
    if (path.startsWith(prefix) && f && f.error) { f.error = ''; const err = $(sel); if (err) err.remove(); }
  });
}
document.addEventListener('input', bind);
document.addEventListener('change', bind);
// Enter in a box presses the button that belongs to it.
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || t.tagName !== 'INPUT' || !t.id) return;
  const b = t.id === 'tracking' ? $('[data-act="ship"]') : t.id.startsWith('chg-') ? t.closest('.stock-change').querySelector('[data-act="stock"]')
    : t.id.startsWith('nv-') ? $('[data-act="add-variant"]') : t.id.startsWith('np-') ? $('[data-act="add-product"]')
    : t.id === 'thr' ? $('[data-act="low-update"]') : t.id.startsWith('al-') ? $('[data-act="login"]') : null;
  if (b) { e.preventDefault(); b.click(); }
});

render();
start();
})();
</script>
</body>
</html>
