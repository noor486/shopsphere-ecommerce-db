<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="burger" data-act="menu-open" aria-label="Open menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
  <button class="logo" data-act="nav" data-view="home">ShopSphere</button>
  <div class="top-right">
    <button class="cart-btn" data-act="cart-open" aria-label="Open cart"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><span class="pill" id="n-cart" hidden>0</span></button>
    <div id="account"></div>
  </div>
</header>
<div class="searchbar">
  <div class="search">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <label class="sr" for="q">Search products</label>
    <input id="q" type="search" placeholder="Search for products" autocomplete="off">
  </div>
</div>
<main id="main"></main>
<footer>ShopSphere is a student project. Products and categories are read from the project's SQL Server database through the ShopSphere API.</footer>
<nav class="dock" aria-label="Main">
  <button data-act="nav" data-view="home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="later" data-what="The wishlist"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Wishlist<span class="count" id="n-wish" hidden>0</span></button>
  <button data-act="later" data-what="My orders"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>My orders</button>
  <button data-act="later" data-what="Your profile"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
</nav>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This page needs JavaScript to show the shop.</noscript>

<script src="api.js"></script>
<script>
/*
  How this page works
  - All data comes from the ShopSphere API (api.js), which reads SQL Server:
      GET /api/categories                      the category menu
      GET /api/products                        every product, from the view vw_ProductCatalog
      GET /api/products?search=&categoryId=    the search box and the category menu
      GET /api/sellers                         seller names and ratings
      GET /api/admin/reports/top-products      units sold, for "Most ordered"
  - The page keeps a copy of what it loaded and draws itself from it (render).
  - Step 5.1: browsing and search only. Product pages, accounts, cart, wishlist,
    checkout and orders are connected in the next steps.
*/
(function () {
'use strict';

// ---------- small helpers ----------
const $ = s => document.querySelector(s);
const ico = (paths, size) => '<svg viewBox="0 0 24 24" width="' + (size || 24) + '" height="' + (size || 24) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
const COLORS = { 'Electronics': '#2F4B9B', 'Fashion': '#B23A5A', 'Home & Kitchen': '#52702F', 'Books': '#6B3FA0', 'Sports & Outdoors': '#B8501A', 'Beauty & Personal Care': '#0E7C7B', 'Bath & Body': '#8A6A1F' };
const SORTS = [['featured', 'Featured'], ['price-asc', 'Price, low to high'], ['price-desc', 'Price, high to low'], ['rating', 'Top rated']];

// ---------- what the page has loaded from the API ----------
let cats = {}, catList = [];      // Category rows, by id
let prods = {}, prodList = [];    // vw_ProductCatalog rows, by id
let sellers = {};                 // Seller rows, by id
let sold = {};                    // units sold per product (top-products report)

const state = {
  ready: false, loadError: '',
  view: 'home', query: '', cat: 0, sort: 'featured',
  results: null, searching: false, // product ids matching the search box / category, from the API
  menuOpen: {}, overlay: null
};

// A vw_ProductCatalog row, in the shape the page uses.
const toProduct = r => ({
  id: r.ProductID, name: r.ProductName, description: r.Description,
  categoryId: r.CategoryID, categoryName: r.CategoryName, sellerId: r.SellerID, sellerName: r.SellerName,
  price: r.MinPrice == null ? Number(r.BasePrice) : Number(r.MinPrice),
  stock: r.TotalStock, reviews: r.ReviewCount, rating: r.AvgRating == null ? 0 : Number(r.AvgRating), image: r.ImageURL
});

// ---------- categories ----------
// One Category table holds everything. A category with no parent is a main category (Electronics).
// A category with a parent is a subcategory (Mobiles belongs to Electronics).
const topOf = id => { let c = cats[id]; while (c && c.parentId) c = cats[c.parentId]; return c; };
const catPath = id => { const out = []; let c = cats[id]; while (c) { out.unshift(c.name); c = c.parentId ? cats[c.parentId] : null; } return out; };

// ---------- products ----------
const colorOf = p => COLORS[(topOf(p.categoryId) || {}).name] || '#12343B';
const initials = n => n.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
// Pictures live in frontend/images/. ProductImage.URL holds the file name at the end
// (https://images.shopsphere.example/p1-main.jpg -> images/p1-main.jpg). Without the file,
// the card shows the coloured tile with the product's initials.
const imgSrc = url => 'images/' + String(url).split('/').pop();
const PIC = src => '<img class="pic" src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">';
const stars = a => '★'.repeat(Math.round(a)) + '☆'.repeat(5 - Math.round(a));
const ratingText = (n, avg, joiner) => n ? '<span aria-hidden="true">' + stars(avg) + '</span> ' + avg.toFixed(1) + joiner + n + ' review' + (n > 1 ? 's' : '') : 'No reviews yet';

// ---------- loading from the API ----------
async function loadCatalog() {
  const [catRows, productRows, sellerRows, top] = await Promise.all([
    api.get('/categories'), api.get('/products'), api.get('/sellers'), api.get('/admin/reports/top-products')]);
  catList = catRows.map(c => ({ id: c.CategoryID, name: c.Name, parentId: c.ParentCategoryID }));
  cats = Object.fromEntries(catList.map(c => [c.id, c]));
  prodList = productRows.map(toProduct);
  prods = Object.fromEntries(prodList.map(p => [p.id, p]));
  sellers = Object.fromEntries(sellerRows.map(s => [s.SellerID, s]));
  sold = Object.fromEntries(top.map(t => [t.ProductID, t.UnitsSold]));
}

// The search box and the category menu ask the API (GET /api/products?search=&categoryId=).
let searchTimer, searchSeq = 0;
function search(delay) {
  clearTimeout(searchTimer);
  const q = state.query.trim(), cat = state.cat;
  if (!q && !cat) { state.results = null; state.searching = false; return; }
  state.searching = true;
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq, params = new URLSearchParams();
    if (q) params.set('search', q);
    if (cat) params.set('categoryId', cat);
    try {
      const rows = await api.get('/products?' + params);
      if (seq !== searchSeq) return;                      // a newer search has started
      rows.forEach(r => { prods[r.ProductID] = toProduct(r); });
      state.results = rows.map(r => r.ProductID);
    } catch (e) {
      if (seq !== searchSeq) return;
      state.results = []; toast(e.message);
    }
    state.searching = false; render();
  }, delay);
}

// ---------- cards ----------
function cardHTML(p, note) {
  return '<article class="card">' +
    '<button class="card-main" data-act="open" data-id="' + p.id + '">' +
      '<span class="tile" style="background:' + colorOf(p) + '">' + esc(initials(p.name)) + (p.image ? PIC(imgSrc(p.image)) : '') +
        (p.stock < 10 ? '<span class="badge-low">' + (p.stock === 0 ? 'Sold out' : 'Low stock') + '</span>' : '') +
        '<span class="tag">' + money(p.price) + '</span></span>' +
      '<span class="card-body">' +
        '<span class="card-name">' + esc(p.name) + '</span>' +
        '<span class="card-meta">' + esc(p.categoryName) + ', sold by ' + esc(p.sellerName) + '</span>' +
        '<span class="rating">' + ratingText(p.reviews, p.rating, ' (') + (p.reviews ? ')' : '') + '</span>' +
        (note ? '<span class="note">' + esc(note) + '</span>' : '') +
      '</span></button>' +
  '</article>';
}
const loading = text => '<p class="loading">' + esc(text || 'Loading…') + '</p>';

// ---------- home ----------
const PERKS = [
  [ico('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'), 'Pay your way', 'Card, JazzCash, Easypaisa, bank transfer or cash on delivery'],
  [ico('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'), 'Follow your order', 'See the payment and shipment status of every order'],
  [ico('<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'), 'Coupon codes', 'Add a code at checkout to save on your order'],
  [ico('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'), 'Read the reviews', 'See what other shoppers think on every product page']
];
function homeView() {
  const popular = prodList.filter(p => sold[p.id]).sort((a, b) => sold[b.id] - sold[a.id] || a.name.localeCompare(b.name)).slice(0, 4);
  const best = prodList.filter(p => p.reviews > 0)
    .sort((a, b) => b.rating - a.rating || b.reviews - a.reviews || a.name.localeCompare(b.name)).slice(0, 4);
  const band = (title, sub, list, note) => list.length ? '<section class="band"><div class="band-head"><h2>' + title + '</h2><p>' + sub + '</p></div><div class="grid">' + list.map(p => cardHTML(p, note ? note(p) : '')).join('') + '</div></section>' : '';
  return '<section class="hero"><div><h1>Everything you need, one cart away</h1>' +
    '<div class="row"><button class="btn primary big" data-act="nav" data-view="shop">Start shopping</button><button class="btn big" data-act="menu-open">Browse categories</button></div></div>' +
    '<div class="hero-art"><img src="images/hero.jpg" alt="" onerror="this.closest(\'.hero\').classList.add(\'no-art\');this.parentNode.remove()"></div></section>' +
    '<div class="perks">' + PERKS.map(k => '<div class="perk">' + k[0] + '<div><b>' + k[1] + '</b><span>' + k[2] + '</span></div></div>').join('') + '</div>' +
    band('Most ordered', 'What shoppers buy the most', popular, p => sold[p.id] + ' sold') +
    band('Top rated', 'The products shoppers rated highest', best) +
    '<section class="cta"><h2>Ready to look around?</h2><p>See every product, or start from a category.</p>' +
    '<div class="row"><button class="btn primary big" data-act="nav" data-view="shop">See all products</button><button class="btn light big" data-act="menu-open">Browse categories</button></div></section>';
}

// ---------- shop ----------
function visibleProducts() {
  const list = state.results ? state.results.map(id => prods[id]).filter(Boolean) : prodList.slice();
  if (state.sort === 'price-asc') list.sort((a, b) => a.price - b.price);
  else if (state.sort === 'price-desc') list.sort((a, b) => b.price - a.price);
  else if (state.sort === 'rating') list.sort((a, b) => b.rating - a.rating);
  else if (!state.results) list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}
function shopView() {
  const q = state.query.trim(), path = state.cat ? catPath(state.cat) : [];
  const title = q && !state.cat ? 'Search results' : state.cat ? path[path.length - 1] : 'All products';
  const sortSel = SORTS.map(s => '<option value="' + s[0] + '"' + (state.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>').join('');
  const filters = (state.cat ? '<button class="pill-btn" data-act="clear-cat" aria-label="Remove category filter">' + esc(path.join(' / ')) + ' ×</button>' : '') +
    (q ? '<button class="pill-btn" data-act="clear-q" aria-label="Remove search filter">“' + esc(q) + '” ×</button>' : '');
  const head = '<div class="shop-head">' + (path.length > 1 ? '<p class="crumb">' + esc(path.slice(0, -1).join(' / ')) + '</p>' : '') + '<h1>' + esc(title) + '</h1>' + (filters ? '<div class="filters">' + filters + '</div>' : '') + '</div>';
  if (state.searching && !state.results) return head + loading('Searching…');
  const list = visibleProducts();
  return head +
    '<div class="toolbar">' + (state.cat || q ? '<p class="count">' + list.length + ' product' + (list.length === 1 ? '' : 's') + '</p>' : '<span></span>') +
    '<label>Sort by <select data-bind="sort">' + sortSel + '</select></label></div>' +
    (list.length ? '<div class="grid">' + list.map(p => cardHTML(p)).join('') + '</div>' :
      '<div class="empty"><h2>No products found</h2><p>Try a shorter word or pick another category.</p><button class="btn" data-act="clear">Clear search and filters</button></div>');
}

// ---------- category menu ----------
// The menu lists the main categories. A main category with subcategories opens as a dropdown.
const CHEVRON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function menuDrawer() {
  const tops = catList.filter(c => !c.parentId).sort((a, b) => a.name.localeCompare(b.name));
  const kidsOf = id => catList.filter(s => s.parentId === id).sort((a, b) => a.name.localeCompare(b.name));
  const here = id => state.view === 'shop' && state.cat === id && !state.query.trim();
  const leaf = (id, label, cls) => '<button class="' + cls + '" data-act="menu-cat" data-id="' + id + '"' + (here(id) ? ' aria-current="true"' : '') + '><span>' + esc(label) + '</span></button>';
  const list = leaf(0, 'All products', '') + tops.map(c => {
    const kids = kidsOf(c.id);
    if (!kids.length) return leaf(c.id, c.name, '');
    const open = !!state.menuOpen[c.id];
    return '<button class="parent" data-act="menu-toggle" data-id="' + c.id + '" aria-expanded="' + open + '" aria-controls="sub-' + c.id + '"><span>' + esc(c.name) + '</span>' + CHEVRON + '</button>' +
      '<div class="subs" id="sub-' + c.id + '"' + (open ? '' : ' hidden') + '>' + leaf(c.id, 'All ' + c.name, 'sub') + kids.map(k => leaf(k.id, k.name, 'sub')).join('') + '</div>';
  }).join('');
  return '<div class="backdrop side left" data-act="backdrop"><aside class="drawer left" role="dialog" aria-modal="true" aria-label="Menu" tabindex="-1">' +
    '<button class="x" data-act="close" aria-label="Close menu">×</button><h2>Shop by category</h2><nav class="menu-list" aria-label="Categories">' + list + '</nav></aside></div>';
}

// ---------- drawing the page ----------
let lastOverlayKey = '';
function render() {
  const active = document.activeElement;
  const keep = active && active.dataset && active.dataset.act ? '[data-act="' + active.dataset.act + '"]' + (active.dataset.id ? '[data-id="' + active.dataset.id + '"]' : '') : null;
  $('#account').innerHTML = '<button class="badge" data-act="later" data-what="Logging in" aria-label="Log in">' + ico('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', 22) + '<span class="tip" aria-hidden="true">Log in</span></button>';
  document.querySelectorAll('.dock [data-view]').forEach(b => b.setAttribute('aria-current', (b.dataset.view === state.view || (b.dataset.view === 'home' && state.view === 'shop')) ? 'page' : 'false'));
  const views = { home: homeView, shop: shopView };
  $('#main').innerHTML = state.loadError ?
      '<div class="empty"><h2>The shop could not load</h2><p>' + esc(state.loadError) + '</p><button class="btn primary" data-act="retry">Try again</button></div>' :
    !state.ready ? loading('Loading the shop…') : (views[state.view] || homeView)();
  // overlay: only the category menu so far
  const key = state.overlay || '';
  $('#overlay').innerHTML = state.overlay === 'menu' ? menuDrawer() : '';
  document.body.classList.toggle('locked', !!state.overlay);
  const box = $('#overlay [tabindex="-1"]');
  if (key && key !== lastOverlayKey && box) box.focus();
  else if (keep) { const el = document.querySelector(keep); if (el) el.focus(); }
  lastOverlayKey = key;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function closeOverlay() { state.overlay = null; }
function showView(v) { state.view = v; closeOverlay(); render(); window.scrollTo(0, 0); }
function clearSearch() { state.query = ''; $('#q').value = ''; }

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id);
  switch (act) {
    case 'nav':
      if (el.dataset.view === 'shop') { state.cat = 0; clearSearch(); search(0); }
      showView(el.dataset.view); break;
    case 'retry': start(); break;
    case 'menu-open': state.menuOpen = {}; if (state.cat) state.menuOpen[topOf(state.cat).id] = true; state.overlay = 'menu'; render(); break;
    case 'menu-toggle': state.menuOpen[id] = !state.menuOpen[id]; render(); break;
    case 'menu-cat': state.cat = id; clearSearch(); search(0); showView('shop'); break;
    case 'clear-cat': state.cat = 0; search(0); render(); break;
    case 'clear-q': clearSearch(); search(0); render(); break;
    case 'clear': state.cat = 0; clearSearch(); search(0); render(); break;
    case 'backdrop': if (e.target === el) { closeOverlay(); render(); } break;
    case 'close': closeOverlay(); render(); break;
    // Connected in the next steps
    case 'open': toast('Product pages come in the next step.'); break;
    case 'cart-open': toast('The cart comes in a later step.'); break;
    case 'later': toast(el.dataset.what + ' comes in a later step.'); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    state.query = t.value; closeOverlay();
    if (state.view !== 'shop') state.view = 'shop';
    search(250);                                          // wait until typing pauses
    render();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.bind === 'sort') { state.sort = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (!state.overlay) return;
  if (e.key === 'Escape') { closeOverlay(); render(); return; }
  if (e.key === 'Tab') {                                  // keep the keyboard inside the open menu
    const box = $('#overlay [tabindex="-1"]'); if (!box) return;
    const f = box.querySelectorAll('button:not([disabled]),input,select,textarea,[href]');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ---------- start ----------
async function start() {
  state.loadError = ''; state.ready = false; render();
  try {
    await loadCatalog();
    state.ready = true;
  } catch (e) { state.loadError = e.message; }
  render();
}
start();
})();
</script>
</body>
</html>
